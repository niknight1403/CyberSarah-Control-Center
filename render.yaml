# Render Blueprint (Infrastruktur als Code) — CyberSarah Control Center
#
# Primärer Deploy-Pfad ist der GitHub-Actions-Workflow
# .github/workflows/render-deploy.yml (API-getrieben, Secrets aus GitHub).
# Diese Datei ist die deklarative Referenz — alternativ kann der Owner
# sie einmalig über das Render-Dashboard anwenden (New → Blueprint),
# wobei die `sync: false`-Werte dort abgefragt werden.
#
# 100 % kostenfrei: Render Free Plan (750 Instanz-Stunden/Monat, Schlaf
# nach 15 Min. Inaktivität) + Neon Free PostgreSQL (DATABASE_URL).
# Beide Dienste teilen sich die 750 Stunden — kein Dauerbetrieb-Dauerlauf.

services:
  # Kombidienst: API (tRPC/Express) + statischer Expo-Web-Export, Port 8000.
  - type: web
    name: cybersarah-control-center
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon-Connection-String (postgresql://…neon.tech/…)
      - key: APP_BASE_URL
        sync: false # https://cybersarah-control-center.onrender.com
      - key: APP_ALLOWED_ORIGINS
        sync: false # onrender-Domain + app.cybersarah-ki.com
      - key: JWT_SECRET
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false # Managed-LLM-Fallback (Sprint 53)
      # Sprint 108 (Zero-Cost-Router): Kostenlose LLM-Provider — Keys via
      # GitHub-Secrets im Render-Deploy-Workflow (nur gesetzt, wenn vorhanden).
      - key: AI_GROQ_API_KEY
        sync: false # Groq (ultraschnelle Gratis-Inferenz, llama-3.3-70b-versatile)
      - key: AI_OPENROUTER_API_KEY
        sync: false # OpenRouter Free Tiers (openrouter/free)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MODE
        value: live
      - key: STRIPE_PRICE_LOOKUP_KEY
        value: cybersarah-monthly
      - key: OAUTH_SERVER_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: WORKSPACE_SERVICE_URL
        sync: false # Workspace-Service-Adresse — aktiviert den /api/render-Proxy
      - key: WORKSPACE_SERVICE_TOKEN
        sync: false # Service-Token serverseitig (statt in der App hinterlegt)

  # FastAPI-Backend: Task-Ledger, Agenten-State, Logs, Chat-Streaming
  # (SSE) + WebSocket-Handler fuer die Expo-App. Autonomous Executor bei
  # SUPERAGENT_MODE=autonomous; Emergency Stop via POST /api/agent/stop.
  - type: web
    name: cybersarah-backend
    runtime: python
    plan: standard # Dauerbetrieb fuer WS/Executor; free wuerde nach 15 Min schlafen.
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9" # 3.10 ist seit Okt 2026 EOL; lokal wird auf 3.11 getestet.
      - key: DATABASE_URL
        fromDatabase:
          name: cybersarah-db
          property: connectionString
      - key: SUPERAGENT_MODE
        value: "autonomous"
      - key: APP_ALLOWED_ORIGINS
        sync: false # Expo-Web-Export + Native-App-Urspruenge
      - key: OPENAI_API_KEY
        sync: false # Optional: Managed-LLM (sonst laeuft der Offline-Executor)

  # Workspace-Service (Custom-AI-Studio): token-geschützt, Port 8787.
  # WORKSPACES_DIR liegt auf Render Free auf ephemeraler Disk — bei
  # Bedarf Persistent Disk hinzufügen (bezahlter Owner-Schritt).
  - type: web
    name: cybersarah-workspace
    runtime: docker
    rootDir: workspace-service
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: SERVICE_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PREVIEW_PUBLIC_BASE_URL
        sync: false
      # Sprint 108 (Zero-Cost-Router): Provider-Keys fuer das Custom-AI-Studio.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Sprint 85 (Persistent Disk): Die Disk selbst wird im Render-Dashboard
      # gebucht (Disks-Seite, Mount /data). Das Flag WORKSPACE_STORAGE_PERSISTENT
      # wird NICHT hier gesetzt, sondern via GitHub-Secret im Render-Deploy-
      # Workflow (Default false) — das Workflow-PUT ueberschreibt Dashboard-ENV.
      # Ablauf: docs/SPRINT_85_PERSISTENT_DISK.md (bezahlter Owner-Schritt).
      #
      # Sprint-85-Follow-up (KOSTENLOSE Alternative, aktiv): Persistenz ueber
      # das vorhandene Neon-Postgres (gleiche DATABASE_URL wie die Haupt-App,
      # eigenes Schema workspace_service). Wird vom Render-Deploy-Workflow
      # als WORKSPACE_DATABASE_URL durchgereicht — Audit-Log + WIP-Datei-
      # backups ueberleben Re-Deploys ohne jegliche Kosten.
      #
      # Render Persistent Disk (bezahltes Add-on): Mount-Pfad /data,
      # WORKSPACES_DIR=/data/workspaces (Service-Default) zeigt dann auf die
      # Disk. Beim Anwenden des Blueprints unkommentiert lassen, solange die
      # Disk nicht gebucht ist — sonst schlaegt der Deploy am fehlenden Mount fehl.
      # disk:
      #   name: cybersarah-workspace-data
      #   mountPath: /data
      #   sizeGB: 1

databases:
  # Render-PostgreSQL fuer das FastAPI-Backend (Task-Ledger, State, Logs).
  # Free-Plan: 30 Tage Aktivitaet — danach im Dashboard verlaengern.
  - name: cybersarah-db
    plan: free
    region: frankfurt
    databaseName: cybersarah
    user: cybersarah_admin
