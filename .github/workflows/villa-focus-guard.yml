name: Villa-Fokus-Wächter

# Nikos Auftrag (02.11.2026): Villa #34 (Kopie von mybabes.ai) und Villa #3
# (Autonomous Revenue Engine) stellen ihre Projekte erst fertig. Alle anderen
# Villen bleiben pausiert, solange der Fokus steht - auch wenn eine davon
# zwischendurch startet.
#
# Der Wächter greift nur über die öffentliche Hub-API ein (kein Neustart, kein
# Code-Deploy) und schaltet sich selbst ab, sobald beide Zielvillen fertig sind.
#
# 26.11.2026: Ein Hub-Ausfall (nginx 502) liess den Wächter alle 15 Minuten rot
# werden, obwohl er korrekt nichts getan hat. Jetzt wird zwischen einem echten
# Konfigurationsfehler (4xx, falsche Zugangsdaten) und einer temporär nicht
# erreichbaren Hub-Instanz (5xx/Netzwerk) unterschieden: den Ausfall selbst
# meldet weiterhin VillaForge-Ops; der Wächter versucht den Login mehrfach und
# beendet den Lauf bei anhaltender Nicht-Erreichbarkeit mit einer Warnung.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, nichts ändern'
        type: boolean
        default: false
      base_url:
        description: 'Hub-Basis-URL (leer = öffentliche Domain)'
        default: ''

concurrency:
  group: villa-focus-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fokus durchsetzen
        env:
          VF_HUB_EMAIL: ${{ secrets.VF_HUB_EMAIL }}
          VF_HUB_PASSWORD: ${{ secrets.VF_HUB_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FOCUS_IDS: '34,3'
          HUB_BASE: ${{ inputs.base_url || 'https://hub.cybersarah-ki.com' }}
        run: |
          set -u
          HUB_BASE="${HUB_BASE%/}"
          export HUB_BASE

          # Login mit kurzen Wiederholungen: ein einzelner 502 aus dem nginx
          # (Deploy, Neustart der Hub-Instanz) soll den Lauf nicht rot machen.
          LOGIN_CODE=000
          TOK=""
          attempt=1
          while [ "$attempt" -le 3 ]; do
            LOGIN_BODY="$(mktemp)"
            LOGIN_CODE=$(curl -s -m 25 -o "$LOGIN_BODY" -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d "{\"email\":\"$VF_HUB_EMAIL\",\"password\":\"$VF_HUB_PASSWORD\"}" \
              "$HUB_BASE/api/auth/login" 2>/dev/null || true)
            # curl schreibt bei einem Abbruch selbst schon 000 - ein zusaetzliches
            # "|| echo 000" ergaebe "000000" und wuerde den Netzwerkfehler als
            # Konfigurationsfehler fehlklassifizieren. Nur die letzten drei
            # Ziffern zaehlen.
            LOGIN_CODE="${LOGIN_CODE:-000}"
            LOGIN_CODE="${LOGIN_CODE: -3}"
            # Antwort defensiv lesen: ein Gateway-Fehler liefert HTML/leer statt JSON
            # und darf keinen Python-Traceback als einzige Fehlermeldung hinterlassen.
            TOK=$(jq -r '.token // ""' "$LOGIN_BODY" 2>/dev/null || echo "")
            if [ -n "$TOK" ]; then
              break
            fi
            # Nur bei vorübergehenden Störungen erneut versuchen (Netzwerk, 5xx).
            # Ein 4xx ist eine Konfigurations-/Zugangsdatenfrage und wird sofort gemeldet.
            case "$LOGIN_CODE" in
              000|5??) ;;
              *) break ;;
            esac
            if [ "$attempt" -lt 3 ]; then
              echo "Login-Versuch $attempt/3: HTTP $LOGIN_CODE - neuer Versuch in $((attempt * 5))s"
              sleep $((attempt * 5))
            fi
            attempt=$((attempt + 1))
          done

          if [ -z "$TOK" ]; then
            # 000 = Netzwerkfehler, 5xx = Hub/Gateway nicht verfügbar.
            # Das ist eine Störung der Hub-Instanz, kein Fehler des Wächters:
            # VillaForge-Ops meldet die Erreichbarkeit, der Wächter läuft in
            # 15 Minuten wieder. Zugangsdaten-/Konfigurationsfehler (4xx)
            # bleiben ein harter Fehler, damit sie nicht untergehen.
            if [ "$LOGIN_CODE" = "000" ] || [ "${LOGIN_CODE#5}" != "$LOGIN_CODE" ]; then
              echo "::warning::Hub nicht erreichbar (HTTP $LOGIN_CODE) - kein Eingriff in diesem Lauf, nächster Versuch in 15 Minuten."
              echo "Hub-Basis: $HUB_BASE"
              echo "Antwort: $(head -c 200 "$LOGIN_BODY" 2>/dev/null | tr -d '\n')"
              exit 0
            fi
            echo "FEHLER: Hub-Login fehlgeschlagen (HTTP $LOGIN_CODE): $(head -c 200 "$LOGIN_BODY" | tr -d '\n')"
            exit 1
          fi
          export TOK
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          TOK = os.environ['TOK']
          DRY = bool(os.environ.get('DRY_RUN'))
          TARGETS = [int(x) for x in os.environ.get('FOCUS_IDS', '34,3').split(',') if x.strip()]
          BASE = os.environ.get('HUB_BASE', 'https://hub.cybersarah-ki.com').rstrip('/')

          def call(path, method='GET', body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(BASE + path, data=data, method=method,
                                           headers={'Authorization': 'Bearer ' + TOK,
                                                    'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:200]
              except Exception as e:
                  return 0, str(e)[:200]

          status, villas = call('/api/villas')
          if status == 0 or 500 <= status <= 599:
              print(f'::warning::Hub nicht erreichbar ({status}) - kein Eingriff in diesem Lauf, nächster Versuch in 15 Minuten.')
              print(f'Antwort: {villas}')
              raise SystemExit(0)
          if status != 200 or not isinstance(villas, list):
              print(f'FEHLER: Villenliste nicht lesbar ({status}): {villas}')
              raise SystemExit(1)

          by_id = {int(v['id']): v for v in villas}
          goals = [by_id.get(i) for i in TARGETS]
          missing = [i for i, g in zip(TARGETS, goals) if not g]
          if missing:
              print(f'FEHLER: Fokus-Villen fehlen im Hub: {missing}')
              raise SystemExit(1)

          print('Fokus-Ziele:')
          for g in goals:
              print(f"  #{g['id']} {g['name']} -> {g['status']}")
          done = [g for g in goals if str(g.get('status')).upper() == 'COMPLETED']
          if len(done) == len(goals):
              print('Fokus erfuellt: alle Zielvillen sind COMPLETED. Der Waechter greift nicht mehr ein.')
              raise SystemExit(0)
          print(f'Offen: {len(goals) - len(done)} von {len(goals)} Zielvillen.')

          changed = []
          for v in villas:
              vid = int(v['id'])
              st = str(v.get('status')).upper()
              if vid in TARGETS:
                  if st in ('PAUSED', 'STOPPING', 'WAITING_FOR_MODEL'):
                      if DRY:
                          print(f'  [dry] wuerde starten: #{vid} {v["name"]} ({st})')
                          continue
                      code, res = call(f'/api/villas/{vid}/orchestrate', 'POST', {'runToCompletion': True})
                      print(f'  Start #{vid} {v["name"]}: HTTP {code} {str(res)[:120]}')
                      changed.append((vid, 'start'))
                  continue
              if st in ('RUNNING', 'WAITING_FOR_MODEL'):
                  if DRY:
                      print(f'  [dry] wuerde pausieren: #{vid} {v["name"]} ({st})')
                      continue
                  code, res = call(f'/api/villas/{vid}/stop', 'POST', {})
                  print(f'  Pause #{vid} {v["name"]}: HTTP {code} {str(res)[:120]}')
                  changed.append((vid, 'pause'))

          status, after = call('/api/villas')
          if status == 200 and isinstance(after, list):
              print('Stand danach:')
              for v in after:
                  mark = '*' if int(v['id']) in TARGETS else ' '
                  print(f" {mark} #{v['id']} {v['status']:<10} {v['name']}")
          print(f'Aenderungen: {len(changed)}')
          PY
