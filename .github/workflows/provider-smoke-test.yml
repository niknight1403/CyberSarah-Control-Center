name: AI Provider Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-smoke-test:
    name: Test Groq, Gemini and OpenRouter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROQ_KEY: ${{ secrets.AI_GROQ_API_KEY || secrets.GROQ_API_KEY }}
      GEMINI_KEY: ${{ secrets.AI_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      OPENROUTER_KEY: ${{ secrets.AI_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      OPENROUTER_REFERER: https://app.cybersarah-ki.com
    steps:
      - name: Run provider requests without exposing credentials
        shell: bash
        run: |
          set -u
          ok=0
          auth_failures=0
          degraded=0
          test_provider() {
            local name="$1"
            local url="$2"
            local model="$3"
            local key="$4"
            local extra_header="${5:-}"
            local output status
            if [ -z "$key" ]; then
              echo "$name: NOT_CONFIGURED"
              return 0
            fi
            if [ -n "$extra_header" ]; then
              if output=$(curl --silent --show-error --max-time 20 \
                -o /tmp/provider-body.json \
                -w '%{http_code} %{time_total}' \
                -X POST "$url" \
                -H 'content-type: application/json' \
                -H "authorization: Bearer $key" \
                -H "$extra_header" \
                --data "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly OK.\"}],\"max_tokens\":8,\"temperature\":0}" 2>/dev/null); then :; else output="000 0"; fi
            else
              if output=$(curl --silent --show-error --max-time 20 \
                -o /tmp/provider-body.json \
                -w '%{http_code} %{time_total}' \
                -X POST "$url" \
                -H 'content-type: application/json' \
                -H "authorization: Bearer $key" \
                --data "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly OK.\"}],\"max_tokens\":8,\"temperature\":0}" 2>/dev/null); then :; else output="000 0"; fi
            fi
            status="${output%% *}"
            case "$status" in
              200)
                echo "$name: PASS HTTP $status (${output#* }s)"
                ok=$((ok + 1))
                ;;
              401|403)
                # Key abgelehnt: das ist ein Konfigurationsfehler, kein Ausfall.
                echo "$name: AUTH_FAIL HTTP $status (${output#* }s)"
                auth_failures=$((auth_failures + 1))
                ;;
              *)
                # 429, 5xx, Timeout: Anbieter gerade nicht verfuegbar. Kein
                # Repo-Defekt, deshalb Warnung statt Fehlschlag.
                echo "$name: DEGRADED HTTP ${status:-000} (${output#* }s)"
                degraded=$((degraded + 1))
                ;;
            esac
          }
          # Sprint 386: openai/gpt-oss-20b ist aus der Groq-Liste gefallen
          # (Key-Changer 01.11.2026, 15:43 UTC); qwen/qwen3.8-27b ist dort
          # live mit HTTP 200 bestaetigt und fuehrt auch in
          # GROQ_MODEL_CANDIDATES.
          test_provider "Groq" "https://api.groq.com/openai/v1/chat/completions" "qwen/qwen3.8-27b" "$GROQ_KEY"
          test_provider "Gemini" "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" "gemini-flash-latest" "$GEMINI_KEY"
          test_provider "OpenRouter" "https://openrouter.ai/api/v1/chat/completions" "openrouter/free" "$OPENROUTER_KEY" "HTTP-Referer: ${OPENROUTER_REFERER:-https://app.cybersarah-ki.com}"
          echo "---"
          echo "Erreichbar: $ok | Key abgelehnt: $auth_failures | Zeitweise nicht verfuegbar: $degraded"
          if [ "$auth_failures" -gt 0 ]; then
            echo "Mindestens ein Key wird vom Anbieter abgelehnt (401/403) — Secret pruefen."
            exit 1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "Kein konfigurierter Anbieter erreichbar — Rotation kann nicht antworten."
            exit 1
          fi
          echo "Mindestens ein Anbieter antwortet. Zeitweise Ausfaelle sind kein Repo-Defekt."
          # Zusammenfassung als Job-Summary, damit der Verlauf lesbar bleibt.
          {
            echo "### AI-Provider-Status"
            echo "| Ergebnis | Anzahl |"
            echo "| --- | --- |"
            echo "| erreichbar | $ok |"
            echo "| Key abgelehnt | $auth_failures |"
            echo "| zeitweise nicht verfuegbar | $degraded |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>/dev/null || true
