name: control-center-autopilot

on:
  # Nach jedem erfolgreichen Deploy laufen lassen, egal ueber welchen Weg
  # deployt wurde: "CyberSarah Deploy & Sync Secrets" ist der Push-Deploy auf
  # main, "Render Deploy" der manuelle Lauf. Ohne den Push-Trigger behauptete
  # der Katalog eine Aktualisierung, die nie stattfand.
  workflow_run:
    workflows: ["Render Deploy", "CyberSarah Deploy & Sync Secrets"]
    types: [completed]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: control-center-autopilot
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Echter Autopilot-Lauf
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Analyse, Revenue-Scans und Entwurfsproduktion ausführen
        env:
          BASE_URL: ${{ secrets.RENDER_PUBLIC_URL }}
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          test -n "$TOKEN"
          case "$BASE_URL" in https://*) ;; *) echo "::error::RENDER_PUBLIC_URL muss HTTPS sein"; exit 1;; esac
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          http_code="$(curl --silent --show-error --max-time 180             --output "$body_file" --write-out '%{http_code}' --request POST             --header "Authorization: Bearer $TOKEN"             "${BASE_URL%/}/api/cron/control-center-autopilot")"
          # Never echo raw response bodies: they may include internal revenue or customer data.
          #
          # 200 = Lauf vollstaendig durch, 207 = Lauf durch, aber Punkte warten
          # (fehlende Schluessel, offene Freigaben). Der Server unterscheidet das
          # bewusst: wartende Konfiguration ist kein Defekt und darf den
          # 24/7-Lauf nicht rot faerben. Echte Blockaden stehen in
          # `result.blocked` und werden unten weiterhin hart geprueft.
          # 401/403/404 sind Konfigurationsdrift, kein Defekt im Control Center:
          # das METRICS_TOKEN passt nicht zum Server oder der Endpunkt wurde
          # verschoben. Das gehoert sichtbar gemeldet (Warnung mit Handlungs-
          # anweisung), darf aber den taeglichen Deploy-Betrieb nicht dauerhaft
          # rot faerben — sonst liest niemand mehr hin.
          case "$http_code" in
            401|403)
              echo "::warning::Control-Center-Cron verweigert das Token (HTTP $http_code). METRICS_TOKEN in GitHub Secrets gegen den Serverwert pruefen. Autopilot ist NICHT gelaufen."
              exit 0
              ;;
            404)
              echo "::warning::Control-Center-Cron nicht gefunden (HTTP 404). Route pruefen. Autopilot ist NICHT gelaufen."
              exit 0
              ;;
          esac
          if [ "$http_code" != "200" ] && [ "$http_code" != "207" ]; then
            echo "::error::Control-Center-Cron antwortet mit HTTP $http_code; keine Rohdaten in Actions-Logs."
            exit 1
          fi
          blocked_count="$(jq -r '(.result.blocked // []) | length' "$body_file")"
          deferred_count="$(jq -r '(.result.deferred // []) | length' "$body_file")"
          if [ "$blocked_count" != "0" ]; then
            echo "::error::Control-Center-Cron meldet $blocked_count echte Blockade(n); Details stehen im Server-Log."
            # Sprint 387: Ursachen im Klartext (max. 200 Zeichen, keine Rohdaten).
            jq -r '(.result.blocked // [])[] | "- BLOCKADE: \(.[0:200])"' "$body_file"
            jq -r '(.result.deferred // [])[] | "- WARTET: \(.[0:200])"' "$body_file"
            exit 1
          fi
          if [ "$http_code" = "207" ] || [ "$deferred_count" != "0" ]; then
            echo "::warning::Control-Center-Cron wartet auf $deferred_count Konfigurationspunkt(e). Kein Defekt, aber nicht vollstaendig abgeschlossen."
          fi
          # Vertrags-Gate mit Klartext-Diagnose: jeder verletzte Punkt wird benannt,
          # damit ein roter Lauf nicht mehr nur "exit code 1" zeigt.
          #
          # `.result.scans.*.ok` ist bewusst KEIN hartes Gate: der Server stuft
          # Infrastruktur-Ausfaelle der externen Scans als "wartet" ein (siehe
          # Sprint 25). Verschwinden darf so ein Ausfall trotzdem nicht — er muss
          # in `deferred` auftauchen, sonst schlaegt das Gate an.
          # Vertrags-Gate mit Klartext-Diagnose: jeder verletzte Punkt wird
          # benannt, damit ein roter Lauf nicht mehr nur "exit code 1" zeigt.
          #
          # `.result.scans.*.ok` ist bewusst KEIN hartes Gate: der Server stuft
          # Infrastruktur-Ausfaelle der externen Scans als "wartet" ein und
          # schreibt sie nach `deferred` (siehe Sprint 25). Verschwinden darf so
          # ein Ausfall trotzdem nicht — fehlt der deferred-Eintrag, schlaegt das
          # Gate an. Fehlt `growthPulse` ganz, wird genau das gemeldet, statt
          # dreimal eine Freigabe-Verletzung zu behaupten.
          gate_problems="$(jq -r '
            def waiting(prefix): (.result.deferred // []) | any(startswith(prefix));
            def gp: .result.growthPulse;
            [
              (if (.result.scans.hara.ok == true) then empty
               elif waiting("HARA-") then empty
               else "HARA-Scan weder ok noch als wartend gemeldet" end),
              (if (.result.scans.expansion.ok == true) then empty
               elif waiting("Expansion-") then empty
               else "Expansion-Scan weder ok noch als wartend gemeldet" end),
              (if ((.result.blocked // []) | length) == 0 then empty
               else "echte Blockade(n): \((.result.blocked // []) | join(" · ") | .[0:200])" end),
              (if gp == null then "Growth Pulse fehlt" else empty end),
              (if gp == null then empty
               elif (gp.generated // -1) >= 0 then empty
               else "Growth Pulse ohne Entwurfszahl" end),
              (if gp == null then empty
               elif gp.externalActionsExecuted == 0 then empty
               else "externe Aktion ohne Freigabe ausgefuehrt" end),
              (if gp == null then empty
               elif gp.plan.spendingAuthorized == false then empty
               else "Ausgaben ohne Freigabe erlaubt" end),
              (if gp == null then empty
               elif gp.plan.publishingAuthorized == false then empty
               else "Veroeffentlichung ohne Freigabe erlaubt" end),
              (if gp == null then empty
               elif gp.plan.priceChangesAuthorized == false then empty
               else "Preisaenderung ohne Freigabe erlaubt" end),
              (if (.result.growth.influencerPersonasLearned // -1) >= 0 then empty
               else "Kennzahl influencerPersonasLearned fehlt" end),
              (if (.result.growth.influencerExperimentsQueued // -1) >= 0 then empty
               else "Kennzahl influencerExperimentsQueued fehlt" end),
              (if (.result.growth.b2bNodes // -1) >= 0 then empty
               else "Kennzahl b2bNodes fehlt" end)
            ] | .[]
          ' "$body_file")"
          if [ -n "$gate_problems" ]; then
            echo "::error::Control-Center-Autopilot verletzt Vertragsbedingungen; Ursachen siehe Liste."
            printf '%s\n' "$gate_problems" | sed 's/^/- VERLETZT: /'
            exit 1
          fi
          # Signed-in diagnostics stay in GitHub Actions: no invented reach or
          # revenue metrics and never echo the authentication token.
          {
            echo "### CyberSarah 24/7 Growth Pulse"
            jq -r '"- Fokus: \(.result.growthPulse.focus)\n- Neue Entwürfe: \(.result.growthPulse.generated)\n- Externe Aktionen: \(.result.growthPulse.externalActionsExecuted)\n- Blocker: \(.result.blocked | length)\n- Wartet auf: \(.result.deferred | length)\n- Ergebnis: \(.ok)"' "$body_file"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$deferred_count" = "0" ]; then
            echo "Control-Center-Autopilot einschließlich Growth Pulse vollständig bestätigt."
          else
            echo "Control-Center-Autopilot einschließlich Growth Pulse ausgeführt; $deferred_count Punkt(e) warten auf Konfiguration oder Freigabe."
          fi
