name: VillaForge-Ops

# VillaForge-Hub (hub.cybersarah-ki.com) auf der Produktions-VM verwalten:
# SQLite-DB finden, Villen auflisten oder gezielt loeschen (mit Namens-Bestaetigung).
#   mode=list                               -> Host-Erkennung + Villa-Inventar (read-only)
#   mode=delete, villa_id, confirm_name     -> Villa samt Tasks/Agents/Chats loeschen
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list | delete"
        default: "list"
      villa_id:
        description: "Villa-ID (nur delete)"
        default: ""
      confirm_name:
        description: "Exakter Villaname als Bestaetigung (nur delete)"
        default: ""

permissions:
  contents: read

concurrency:
  group: villaforge-ops

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Zugang einrichten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY2 || secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
      - name: VillaForge verwalten
        env:
          MODE: ${{ inputs.mode }}
          VILLA_ID: ${{ inputs.villa_id }}
          CONFIRM_NAME: ${{ inputs.confirm_name }}
          SSH_CMD: ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o BatchMode=yes ${{ secrets.PRODUCTION_SSH_USER2 || secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST2 || secrets.PRODUCTION_SSH_HOST }}
        run: |
          case "$MODE" in
            list)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            delete)
              if ! echo "$VILLA_ID" | grep -qE '^[0-9]+$'; then echo "FEHLER: villa_id muss numerisch sein"; exit 1; fi
              NAME_B64=$(printf '%s' "$CONFIRM_NAME" | base64 -w0)
              $SSH_CMD "VILLA_ID=$VILLA_ID CONFIRM_NAME_B64=$NAME_B64 bash -c 'echo \"\" | base64 -d | node -'"
            *) echo "Unbekannter Modus: $MODE"; exit 1;;
          esac
