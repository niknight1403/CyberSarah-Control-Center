name: Observability Hub Validation

on:
  pull_request:
    paths:
      - "server/observability-hub.ts"
      - "server/jobs/revenueGuard.ts"
      - "server/_core/index.ts"
      - "infra/observability/**"
      - ".github/workflows/observability-hub.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "server/observability-hub.ts"
      - "server/jobs/revenueGuard.ts"
      - "server/_core/index.ts"
      - "infra/observability/**"
      - ".github/workflows/observability-hub.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate dashboard JSON
        run: jq empty infra/observability/dashboards/revenue-growth-command-center.json
      - name: Validate YAML
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          files = list(pathlib.Path("infra/observability").rglob("*.yml")) + list(pathlib.Path("infra/observability").rglob("*.yaml"))
          files += [pathlib.Path("infra/observability/docker-compose.yml")]
          for path in files:
              yaml.safe_load(path.read_text())
              print("valid:", path)
          PY
      - name: Validate Compose model
        run: |
          cd infra/observability
          cp .env.example .env
          sed -i 's/REPLACE_WITH_RANDOM_SECRET/ci-only-not-a-secret/g' .env
          docker compose config --quiet
