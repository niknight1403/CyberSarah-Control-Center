name: Build Android APK (Expo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run check

      - name: Test suite
        run: npm test

      - name: Production server build
        run: npm run build

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          cat eas-build.json

      - name: Download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          build_id="$(jq -r 'if type == "array" then .[0].id else .id end' eas-build.json)"
          test -n "$build_id" && test "$build_id" != "null"
          download_output="$(eas build:download --build-id "$build_id" --non-interactive 2>&1)"
          printf '%s\n' "$download_output"
          apk_path="$(printf '%s\n' "$download_output" | sed -n 's/^Build downloaded to //p' | tail -1)"
          test -n "$apk_path"
          test -f "$apk_path"
          mv "$apk_path" "artifacts/CyberSarah-Control-Center-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybersarah-control-center-${{ github.ref_name }}-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
