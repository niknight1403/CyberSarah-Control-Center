name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "VersionName für die APK (z. B. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Expo-Web-Export → Capacitor → Gradle-APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren (inkl. devDependencies)
        run: npm ci --no-audit --no-fund

      - name: TypeScript-Check
        run: npm run check

      - name: CSS-Interop-Cache seeden (SHA-1-Fix fuer frische Installs)
        run: |
          mkdir -p node_modules/react-native-css-interop/.cache
          touch node_modules/react-native-css-interop/.cache/web.css

      - name: Expo-Web-Export (web-dist)
        run: EXPO_USE_METRO_WORKSPACE_ROOT=1 npx expo export -p web --output-dir web-dist

      - name: Capacitor-Sync (Web-Assets → Android)
        run: npx cap sync android

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle-Berechtigungen korrigieren
        run: chmod +x android/gradlew

      - name: Debug-APK bauen (Gradle)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK verifizieren
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "APK fehlt: $APK"; exit 1; }
          ls -lh "$APK"

      - name: Release-AAB bauen (Google Play, R8-obfuskiert)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: AAB verifizieren und als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CyberSarah-ControlCenter-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: APK umbenennen und Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "CyberSarah-ControlCenter-v${VERSION}-debug.apk"
          TAG="v${VERSION}-apk"
          NOTES="Automatisierter Capacitor-Build aus Commit ${GITHUB_SHA::7}.
          Web-Export der CyberSarah-App als Android-Wrapper (com.cybersarah.controlcenter).
          Installation: Unbekannte Quellen erlauben und die APK oeffnen.
          Play-Store-AAB (R8-obfuskiert, unsigniert — Signierung ist Owner-Handoff) liegt als Workflow-Artefakt bereit."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "CyberSarah-ControlCenter-v${VERSION}-debug.apk" --clobber
          else
            gh release create "$TAG" "CyberSarah-ControlCenter-v${VERSION}-debug.apk" \
              --title "CyberSarah Control Center v${VERSION} (Android APK)" \
              --notes "$NOTES"
          fi
