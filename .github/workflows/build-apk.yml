name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "VersionName für die APK (z. B. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Expo-Web-Export → Capacitor → Gradle-APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren (inkl. devDependencies)
        run: npm ci --no-audit --no-fund

      - name: TypeScript-Check
        run: npm run check

      - name: CSS-Interop-Cache seeden (SHA-1-Fix fuer frische Installs)
        run: |
          mkdir -p node_modules/react-native-css-interop/.cache
          touch node_modules/react-native-css-interop/.cache/web.css

      - name: Expo-Web-Export (web-dist)
        run: EXPO_USE_METRO_WORKSPACE_ROOT=1 npx expo export -p web --output-dir web-dist
        env:
          # Sprint 73: API-Basis-URL explizit zur Build-Zzeit einbrennen.
          # Zuvor leer -> Code fiel auf DEFAULT_API_BASE_URL zurueck; explizit
          # gesetzt schliesst Tippfehler/Fallback-Probleme kuenftig aus.
          EXPO_PUBLIC_API_BASE_URL: https://app.cybersarah-ki.com

      - name: Capacitor-Sync (Web-Assets → Android)
        run: npx cap sync android

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle-Berechtigungen korrigieren
        run: chmod +x android/gradlew

      - name: Debug-APK bauen (Gradle)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK verifizieren
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "APK fehlt: $APK"; exit 1; }
          ls -lh "$APK"

      - name: Release-Signing-Keystore aus Secrets dekodieren
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cybersarah-release.keystore"
          ls -l "$RUNNER_TEMP/cybersarah-release.keystore"

      - name: Signierte Release-APK bauen (Gradle)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PcybersarahKeystorePath="$RUNNER_TEMP/cybersarah-release.keystore"

      - name: Release-APK verifizieren (Signatur-Check mit apksigner)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "Release-APK fehlt: $APK"; exit 1; }
          ls -lh "$APK"
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | head -3
          rm -f "$RUNNER_TEMP/cybersarah-release.keystore"

      - name: Release-AAB bauen (Google Play, R8-obfuskiert)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: AAB verifizieren und als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CyberSarah-ControlCenter-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: APK umbenennen und Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "CyberSarah-ControlCenter-v${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "CyberSarah-ControlCenter-v${VERSION}-release.apk"
          TAG="v${VERSION}-apk"
          NOTES="Automatisierter Capacitor-Build aus Commit ${GITHUB_SHA::7}.
          Web-Export der CyberSarah-App als Android-Wrapper (com.cybersarah.controlcenter).
          Installation: Unbekannte Quellen erlauben und die APK oeffnen.
          Play-Store-AAB (R8-obfuskiert, unsigniert — Signierung ist Owner-Handoff) liegt als Workflow-Artefakt bereit."
          APK_FILES="CyberSarah-ControlCenter-v${VERSION}-debug.apk CyberSarah-ControlCenter-v${VERSION}-release.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $APK_FILES --clobber
          else
            gh release create "$TAG" $APK_FILES \
              --title "CyberSarah Control Center v${VERSION} (Android APK)" \
              --notes "$NOTES"
          fi
