name: DB-Ops

# Datenbank-Operationen (Neon/Postgres) ueber den GitHub-Runner.
# Derzeit unterstuetzt: Chat-Verlauf leeren (preview/delete).
# DATABASE_URL kommt aus den Repo-Secrets — kein Klartext im Workflow.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        type: choice
        options:
          - chat-clear-preview
          - chat-clear-delete
          - publishing-enqueue-live-test
          - publishing-status
          - publishing-diagnose
          - x-diagnose
          - x-post-live-test
          - user-status
          - user-set-password
          - quota-diagnose
          - migrate-pending
          - apply-telemetry
          - reconcile-journal
          - publishing-columns-ensure
        default: chat-clear-preview
      email:
          description: "E-Mail fuer user-status/user-set-password"
          required: false
          default: ""
      hash:
          description: "scrypt-Hash (scrypt$salt$derived) fuer user-set-password — niemals Klartext"
          required: false
          default: ""

permissions:
  contents: read

jobs:
  db-ops:
    name: "DB-Ops: ${{ github.event.inputs.operation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Chat-Verlauf Operation
        if: startsWith(github.event.inputs.operation, 'chat-clear')
        working-directory: scripts/db-ops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OP: ${{ github.event.inputs.operation }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install pg --no-audit --no-fund >/dev/null 2>&1
          node chat-clear.mjs

      - name: Benutzer-Diagnose (user-status)
        if: github.event.inputs.operation == 'user-status'
        working-directory: scripts/db-ops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OP: user-status
          EMAIL: ${{ github.event.inputs.email }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install pg --no-audit --no-fund >/dev/null 2>&1
          node user-status.mjs

      - name: Passwort-Hash setzen (user-set-password)
        if: github.event.inputs.operation == 'user-set-password'
        working-directory: scripts/db-ops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OP: user-set-password
          EMAIL: ${{ github.event.inputs.email }}
          HASH: ${{ github.event.inputs.hash }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install pg --no-audit --no-fund >/dev/null 2>&1
          node user-set-password.mjs

      - name: Publishing Live-Test Operation (Sprint 370)
        # Bewusst explizit statt startsWith('publishing-'): die Spalten-Operation
        # heisst auch publishing-*, ist aber kein Live-Test und wurde sonst vom
        # Live-Test-Skript mit "Unbekannte Publishing-Operation" abgewiesen.
        if: >-
          github.event.inputs.operation == 'publishing-enqueue-live-test' ||
          github.event.inputs.operation == 'publishing-status' ||
          github.event.inputs.operation == 'publishing-diagnose' ||
          startsWith(github.event.inputs.operation, 'x-')
        working-directory: scripts/db-ops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OP: ${{ github.event.inputs.operation }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install pg --no-audit --no-fund >/dev/null 2>&1
          node publishing-live-test.mjs

      - name: Telemetrie-Migration direkt anwenden (idempotent)
        if: github.event.inputs.operation == 'apply-telemetry'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund >/dev/null 2>&1
          FILE=drizzle/0027_billing_telemetry.sql \
          TABLES=revenue_loop_runs,agent_executions,credit_ledger_entries \
          npx tsx scripts/db-ops/apply-sql.ts

      - name: Journal-Abgleich (Hashes nachtragen, kein SQL)
        if: github.event.inputs.operation == 'reconcile-journal'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund >/dev/null 2>&1
          npx tsx scripts/db-ops/reconcile-journal.ts --apply

      - name: Migrationen anwenden (nur ausstehende)
        if: github.event.inputs.operation == 'migrate-pending'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          npm ci --include=dev --no-audit --no-fund >/dev/null 2>&1
          echo "== Journal vorher =="
          node scripts/ops/stamp-migrations.mjs 2>&1 | tail -5 || true
          echo "== Migrationslauf =="
          npx drizzle-kit migrate 2>&1 | tail -8
          echo "== Kontrolle: neue Tabelle =="
          node -e '
            const { Client } = require("pg");
            (async () => {
              const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
              await client.connect();
              const res = await client.query("select to_regclass($1) as tbl", ["public.revenue_loop_runs"]);
              console.log("revenue_loop_runs:", res.rows[0].tbl ?? "FEHLT");
              await client.end();
            })().catch((error) => { console.error("Kontrolle fehlgeschlagen:", error.message); process.exit(1); });
          '

      # Drift-Fix: drizzle-kit ueberspringt Migrationen, die im Journal schon als
      # angewandt gelten. Genau das ist am 03.11. passiert — 0026 stand im
      # Journal, die Spalten fehlten aber in der Produktion, und jede Abfrage
      # auf publishingJobs endete mit "column content_override does not exist".
      # Diese Operation spielt 0026 ein (rein additiv, IF NOT EXISTS) und prueft
      # danach, statt dem Journal zu glauben.
      - name: Publishing-Spalten sicherstellen (idempotent)
        if: github.event.inputs.operation == 'publishing-columns-ensure'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          npm ci --include=dev --no-audit --no-fund >/dev/null 2>&1

          # Die Produktions-DSN zeigt auf eine IP, das Zertifikat nennt einen
          # Hostnamen. sslmode aus der URL entfernen und selbst festlegen:
          # pg behandelt sslmode=require inzwischen wie verify-full.
          export PGSSLMODE=require
          NOSSL="$(printf '%s' "$DATABASE_URL" | sed -E 's/([?&])sslmode=[^&]*/\1/; s/[?&]+$//')"

          show() {
            PGCONN="$NOSSL" node -e '
              const { Client } = require("pg");
              (async () => {
                const c = new Client({ connectionString: process.env.PGCONN, ssl: { rejectUnauthorized: false } });
                await c.connect();
                const r = await c.query("select column_name from information_schema.columns where table_name = $1 order by column_name", ["publishingJobs"]);
                console.log(r.rows.map(x => x.column_name).join(", ") || "(Tabelle fehlt)");
                await c.end();
              })().catch(e => { console.error("Lesen fehlgeschlagen:", e.message); process.exit(1); });
            '
          }

          echo "== Spalten vorher =="
          show
          echo "== Migration 0026 anwenden =="
          psql "$NOSSL" -v ON_ERROR_STOP=1 -q -f drizzle/0026_approved_content_pipeline.sql
          echo "== Spalten nachher =="
          show
          echo "== Pruefung =="
          PGCONN="$NOSSL" node -e '
            const { Client } = require("pg");
            (async () => {
              const c = new Client({ connectionString: process.env.PGCONN, ssl: { rejectUnauthorized: false } });
              await c.connect();
              const r = await c.query("select column_name from information_schema.columns where table_name = $1", ["publishingJobs"]);
              const have = new Set(r.rows.map(x => x.column_name));
              await c.end();
              const missing = ["content_override", "source_draft_id"].filter(x => !have.has(x));
              if (missing.length) { console.error("FEHLT weiterhin:", missing.join(", ")); process.exit(1); }
              console.log("OK: content_override und source_draft_id vorhanden.");
            })().catch(e => { console.error("Pruefung fehlgeschlagen:", e.message); process.exit(1); });
          '

      - name: Quota-Diagnose (schreibgeschuetzt)
        if: github.event.inputs.operation == 'quota-diagnose'
        working-directory: scripts/db-ops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install pg --no-audit --no-fund >/dev/null 2>&1
          node quota-diagnose.mjs
