name: Render Status & Wake

# Prueft Service-/Deploy-Status via Render-API und weckt die Free-Instanz.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Service-Status via Render-API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          api() { curl -s -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" "https://api.render.com/v1/$1"; }
          SERVICES=$(api "services?limit=20")
          echo "$SERVICES" | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for entry in data:
              s = entry.get('service', entry)
              print(s.get('name'), '|', s.get('status'), '|', s.get('suspended') if 'suspended' in s else s.get('details',{}).get('suspended'), '|', s.get('id'))
          "
          SVID=$(echo "$SERVICES" | python3 -c "
          import json,sys
          for entry in json.load(sys.stdin):
              s = entry.get('service', entry)
              if s.get('name') == 'cybersarah-control-center': print(s['id']); break
          ")
          echo "== Letzte Deploys =="
          api "services/$SVID/deploys?limit=3" | python3 -c "
          import json,sys
          for entry in json.load(sys.stdin):
              d = entry.get('deploy', entry)
              print(d.get('id'), '|', d.get('status'), '|', d.get('finishedAt'), '|', d.get('commit',{}).get('id',''))
          "

      - name: Wecken und Health pruefen
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/h.txt -w "%{http_code}" --max-time 60 "https://cybersarah-control-center-hmlc.onrender.com/api/health")
            ROUTE=$(curl -s -D- -o /dev/null --max-time 30 "https://cybersarah-control-center-hmlc.onrender.com/api/health" | grep -i "x-render-routing" | tr -d '\r' || true)
            echo "Versuch $i: HTTP=$CODE $ROUTE"
            [ "$CODE" = "200" ] && break
            sleep 20
          done
          echo "== /api/health =="; cat /tmp/h.txt; echo
          echo "== /api/ready =="
          curl -s --max-time 90 "https://cybersarah-control-center-hmlc.onrender.com/api/ready"; echo
