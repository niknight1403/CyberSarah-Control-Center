name: Server-Ops

# Sichere Operations-Bruecke zum CyberSarah-Produktionsserver.
# Zweck: Status-Checks, PM2-Restarts, Log-Abruf und Self-Healing aus der
# CI heraus — ohne beliebigen Shell-Input, nur fest definierte Operationen.
# Ausloesung: GitHub UI → Actions → "Server-Ops" → Run workflow.
# Alle Zugangsdaten kommen aus Repo-Secrets — die frischen Suffix-2-Varianten
# (PRODUCTION_SSH_KEY2/HOST2/USER2) haben Vorrang, alte Namen als Fallback.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation auf dem Produktionsserver"
        type: choice
        options:
          - status
          - pm2-restart
          - logs
          - health
          - disk-report
          - disk-clean
          - db-migrate
          - pm2-redeploy
          - db-probe2
          - db-probe
          - db-check
          - deploy
          - deploy-pull
          - probe
        default: status
      service:
        description: "PM2-Service fuer Restart (leer = alle)"
        required: false
        default: ""

concurrency:
  group: server-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    name: "Server-Ops: ${{ github.event.inputs.operation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Zugang einrichten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY2 || secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key

      - name: Operation ausfuehren
        env:
          OP: ${{ github.event.inputs.operation }}
          SVC: ${{ github.event.inputs.service }}
          SSH_CMD: ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o BatchMode=yes ${{ secrets.PRODUCTION_SSH_USER2 || secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST2 || secrets.PRODUCTION_SSH_HOST }}
        run: |
          case "$OP" in
            status)
              $SSH_CMD 'echo "== pm2 =="; (pm2 list 2>/dev/null || echo "pm2 nicht gefunden"); echo "== systemd =="; (systemctl list-units --type=service --state=running 2>/dev/null | head -20 || true); echo "== docker =="; (docker ps --format "table {{.Names}}\t{{.Status}}" 2>/dev/null || echo "docker nicht gefunden"); echo "== system =="; uptime; df -h / | tail -1; ls -la /opt/cybersarah-control-center 2>/dev/null | head -15 || true'
              ;;
            pm2-restart)
              if [ -n "$SVC" ]; then
                $SSH_CMD "pm2 restart $SVC --update-env && sleep 3 && pm2 list"
              else
                $SSH_CMD 'pm2 restart all --update-env && sleep 3 && pm2 list'
              fi
              ;;
            logs)
              $SSH_CMD 'pm2 logs --nostream --lines 100 2>/dev/null || journalctl -n 100 --no-pager 2>/dev/null | tail -100'
              ;;
            health)
              $SSH_CMD 'echo "== lokale Dienste =="; curl -s -o /dev/null -w "localhost:3000/ → HTTP %{http_code}\n" --max-time 5 http://localhost:3000/ || true; curl -s -o /dev/null -w "localhost:3000/api/ready → HTTP %{http_code}\n" --max-time 5 http://localhost:3000/api/ready || true; curl -s -o /dev/null -w "localhost:10000 → HTTP %{http_code}\n" --max-time 5 http://localhost:10000/ || true; echo "== pm2 health =="; pm2 jlist 2>/dev/null | head -c 2000 || true'
              ;;
            disk-report)
              $SSH_CMD 'echo "== df =="; df -h / | tail -1; echo "== groesste Verzeichnisse =="; du -xh --max-depth=2 / 2>/dev/null | sort -rh | head -20; echo "== Top-Dateien /opt =="; find /opt/cybersarah-control-center -type f -size +50M -exec ls -lh {} \; 2>/dev/null | head -10; echo "== journal =="; journalctl --disk-usage 2>/dev/null || true; echo "== apt/npm cache =="; du -sh /var/cache/apt /home/*/.npm /root/.npm 2>/dev/null || true'
              ;;
            disk-clean)
              $SSH_CMD 'echo "== Vorher =="; df -h / | tail -1; echo "== npm-Cache =="; npm cache clean --force 2>/dev/null || true; echo "== Gradle-Cache =="; rm -rf ~/.gradle/caches/* 2>/dev/null || true; echo "== pip-Cache =="; rm -rf ~/.cache/pip 2>/dev/null || true; echo "== Journal auf 200M =="; sudo -n journalctl --vacuum-size=200M 2>/dev/null || journalctl --vacuum-size=200M 2>/dev/null || echo "journal nicht vacuumbar"; echo "== apt-Cache =="; sudo -n apt-get clean 2>/dev/null || true; echo "== bashrc =="; sed -i "/AAAAB3NzaC1yc2EAAAADAQABAAACAQDBuTFmaD/d;/u0_a691@localhost/d" ~/.bashrc && echo "bashrc bereinigt" || echo "bashrc fix fehlgeschlagen"; echo "== Nachher =="; df -h / | tail -1'
              ;;
            db-probe2)
              $SSH_CMD 'cd /opt/cybersarah-control-center; node -e "
const fs=require(String.fromCharCode(102,115));const cp=require(String.fromCharCode(99,104,105,108,100,95,112,114,111,99,101,115,115));const Pool=require(String.fromCharCode(112,103)).Pool;
function shape(u){try{const p=new URL(u);return p.protocol+String.fromCharCode(47,47)+p.hostname+String.fromCharCode(58)+p.port+String.fromCharCode(47)+p.pathname.slice(1)+String.fromCharCode(32,112,97,115,115,58)+(p.password?String.fromCharCode(108,97,110,103,32)+p.password.length:String.fromCharCode(70,69,72,76,84))}catch(e){return String.fromCharCode(85,82,76,45,117,110,103,117,101,108,116,105,103)}}
function test(tag,u){return new Pool({connectionString:u}).query(String.fromCharCode(83,69,76,69,67,84,32,49)).then(()=>console.log(tag,String.fromCharCode(58,32,79,75))).catch(e=>console.log(tag,String.fromCharCode(58,32,70,69,72,76,69,82,58),e.code,String.fromCharCode(124),e.message.split(String.fromCharCode(10))[0]))}
(async()=>{
const raw=fs.readFileSync(String.fromCharCode(46,101,110,118),String.fromCharCode(117,116,102,56)).split(String.fromCharCode(10)).find(l=>l.startsWith(String.fromCharCode(68,65,84,65,66,65,83,69,95,85,82,76,61)));
const envUrl=raw?raw.slice(13).trim().replace(/^[\x22\x27]|[\x22\x27]$/g,String.fromCharCode(0)):null;
console.log(String.fromCharCode(61,61,32,46,101,110,118,45,85,82,76,32,70,111,114,109,32,61,61));console.log(envUrl?shape(envUrl):String.fromCharCode(102,101,104,108,116));
if(envUrl)await test(String.fromCharCode(69,78,86),envUrl);
const out=cp.execSync(String.fromCharCode(112,109,50,32,101,110,118,32,49)).toString();
const line=out.split(String.fromCharCode(10)).find(l=>l.startsWith(String.fromCharCode(68,65,84,65,66,65,83,69,95,85,82,76,58)));
const pm2Url=line?line.replace(/^DATABASE_URL:\s*/,String.fromCharCode(0)).trim():null;
console.log(String.fromCharCode(61,61,32,80,77,50,45,85,82,76,32,70,111,114,109,32,61,61));console.log(pm2Url?shape(pm2Url):String.fromCharCode(102,101,104,108,116));
if(pm2Url)await test(String.fromCharCode(80,77,50),pm2Url);
console.log(String.fromCharCode(61,61,32,46,101,110,118,45,86,97,114,115,32,61,61));
console.log(fs.readFileSync(String.fromCharCode(46,101,110,118),String.fromCharCode(117,116,102,56)).split(String.fromCharCode(10)).filter(l=>l.includes(String.fromCharCode(61))).map(l=>l.split(String.fromCharCode(61))[0]).join(String.fromCharCode(44)));
})()"
              ;;
            db-probe)
              $SSH_CMD 'cd /opt/cybersarah-control-center; set -a; . ./.env 2>/dev/null; set +a; echo "== Test mit .env-URL =="; node -e "const {Pool}=require(String.fromCharCode(112,103)); const p=new Pool({connectionString:process.env.DATABASE_URL}); p.query(String.fromCharCode(83,69,76,69,67,84,32,49)).then(r=>{console.log(String.fromCharCode(68,66,45,79,75));process.exit(0)}).catch(e=>{console.log(String.fromCharCode(68,66,45,70,69,72,76,69,82,58), e.code, String.fromCharCode(124), e.message.split(String.fromCharCode(10))[0]);process.exit(0)})"; echo "== URL-Hash .env =="; sed -n "s/^DATABASE_URL=//p" .env 2>/dev/null | tr -d "\r\n" | sha256sum | cut -c1-16; echo "== URL-Hash PM2-Prozess =="; pm2 env 1 2>/dev/null | sed -n "s/^DATABASE_URL: //p" | tr -d "\r\n" | sha256sum | cut -c1-16; echo "== ecosystem.config.js DATABASE_URL-Zeile vorhanden? =="; grep -c "DATABASE_URL" ecosystem.config.js 2>/dev/null || echo "keine ecosystem.config.js"; echo "== Hat PM2-Prozess DATABASE_URL? =="; pm2 env 1 2>/dev/null | grep -c "^DATABASE_URL:" || true; echo "== Postgres-Log (letzte Auth-/Verbindungsfehler) =="; sudo -n journalctl -u postgresql@18-main --since "18:40" --no-pager 2>/dev/null | grep -iE "auth|fatal|error|reject" | tail -8 || echo "kein sudo-journal"; echo "== Letzte App-Fehler komplett =="; tail -6 /opt/cybersarah-control-center/logs/pm2-error.log 2>/dev/null || true'
              ;;
            db-check)
              $SSH_CMD 'echo "== Postgres-Dienst =="; (sudo -n systemctl is-active postgresql 2>/dev/null || systemctl is-active postgresql 2>/dev/null || echo "unbekannt"); echo "== Port 5432 =="; ss -tlnp 2>/dev/null | grep ":5432" || echo "5432 nicht gebunden"; echo "== pg_isready =="; pg_isready 2>/dev/null || sudo -n pg_isready 2>/dev/null || echo "pg_isready nicht verfuegbar"; echo "== Postgres-Prozesse =="; ps aux | grep -c "[p]ostgres" || true; echo "== Alle postgres-Systemdienste =="; systemctl list-units --type=service 2>/dev/null | grep -i postgres || echo "kein postgres-Service aktiv"; echo "== Platte =="; df -h / | tail -1; echo "== Letzte PM2-Fehler =="; tail -12 /opt/cybersarah-control-center/logs/pm2-error.log 2>/dev/null || tail -12 ~/.pm2/logs/cybersarah-control-center-error.log 2>/dev/null || true'
              ;;
            db-migrate)
              $SSH_CMD 'cd /opt/cybersarah-control-center && echo "== vorhandene Migrationen =="; ls drizzle/*.sql 2>/dev/null | tail -4; echo "== .env vorhanden =="; test -f .env && echo ja || echo "keine .env — DATABASE_URL nicht verfuegbar"; echo "== Migration ausfuehren =="; set -a; . ./.env 2>/dev/null; set +a; ./node_modules/.bin/drizzle-kit migrate 2>&1 | tail -15; echo "== Tabellen-Check =="; npx drizzle-kit check 2>&1 | tail -5 || true'
              ;;
            pm2-redeploy)
              $SSH_CMD 'echo "== Port 3000 vorher =="; ss -tlnp 2>/dev/null | grep ":3000" || echo "frei"; echo "== PM2 stop =="; pm2 stop all; sleep 2; echo "== Port-Inhaber killen (fuser) =="; fuser -k 3000/tcp 2>/dev/null && echo "Prozess auf 3000 beendet" || echo "Port 3000 war bereits frei"; sleep 2; echo "== PM2 start =="; pm2 start all; sleep 5; echo "== Status =="; pm2 list; echo "== Port nachher =="; ss -tlnp 2>/dev/null | grep ":3000" || echo "nicht gebunden"; echo "== HTTP-Check =="; curl -s -o /dev/null -w "localhost:3000/ → HTTP %{http_code}\n" --max-time 5 http://localhost:3000/ || true; curl -s -o /dev/null -w "localhost:3000/api/ready → HTTP %{http_code}\n" --max-time 5 http://localhost:3000/api/ready || true; echo "== Letzte App-Logzeilen =="; tail -6 ~/.pm2/logs/cybersarah-control-center-out.log 2>/dev/null || tail -6 /opt/cybersarah-control-center/logs/pm2-out.log 2>/dev/null || true'
              ;;
            deploy)
              $SSH_CMD 'cd /opt/cybersarah-control-center && echo "== Git vorher =="; git log --oneline -2; echo "== Arbeitskopie pruefen =="; if ! git diff-index --quiet HEAD --; then echo "ABBRUCH: modifizierte Dateien"; git status --porcelain | grep -v "^??"; exit 1; else echo "OK: sauber, untracked ignoriert"; fi; echo "== Pull =="; git pull --ff-only origin main && echo "== Git nachher =="; git log --oneline -2 && echo "== Abhaengigkeiten =="; npm ci --no-audit --no-fund 2>&1 | tail -3 && echo "== Build =="; npm run build 2>&1 | tail -5 && echo "== Migration =="; set -a; . ./.env 2>/dev/null; set +a; ./node_modules/.bin/drizzle-kit migrate 2>&1 | tail -5 && echo "== PM2 Neustart =="; pm2 stop all; sleep 2; fuser -k 3000/tcp 2>/dev/null && echo "Alte Prozesse beendet" || echo "Port 3000 war frei"; sleep 2; pm2 start all; sleep 6; echo "== Status =="; pm2 list; echo "== HTTP =="; curl -s -o /dev/null -w "localhost:3000 → HTTP %{http_code}\n" --max-time 8 http://localhost:3000/api/ready || true; echo "== Letzte App-Logzeilen =="; tail -8 ~/.pm2/logs/cybersarah-control-center-out.log 2>/dev/null || tail -8 /opt/cybersarah-control-center/logs/pm2-out.log 2>/dev/null || true'
              ;;
            probe)
              for U in root cybersarah ubuntu debian admin; do
                echo "== Teste Benutzer: $U =="
                ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes -o PasswordAuthentication=no $U@${{ secrets.PRODUCTION_SSH_HOST2 || secrets.PRODUCTION_SSH_HOST }} 'echo LOGIN_OK als $USER; hostname' && break || true
              done
              ;;
            deploy-pull)
              $SSH_CMD 'cd /opt/cybersarah-control-center && git fetch origin main && git status && git log --oneline -3 && echo "ACHTUNG: Pull erfolgt nur nach expliziter Freigabe" '
              ;;
            *)
              echo "Unbekannte Operation: $OP" >&2
              exit 1
              ;;
          esac
