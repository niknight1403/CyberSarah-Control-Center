name: Server-Ops (Legacy)

# Der fruehere monolithische Workflow ueberschritt GitHubs Expression-Limit.
# Alle aktiven Produktionsoperationen liegen in ccc-ops.yml und den
# spezialisierten Deploy-/OpenHands-Workflows. Diese kleine Legacy-Huelle
# bleibt nur fuer einen klaren Hinweis in der Actions-Oberflaeche erhalten.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Hinweis
        run: |
          echo "Server-Ops ist stillgelegt."
          echo "Bitte CCC-Ops fuer Deploy, Health, PM2 und Revenue-DB-URL verwenden."
