name: Diagnose Admin-Rollen

# Read-only-Diagnose: Warum hat der Login keine Admin-Rechte?
# a) Modus db:     Listet alle Konten aus der produktiven Neon-DB
#                  (Rolle, E-Mail, Login-Methode) und liest ADMIN_EMAIL/
#                  OWNER_OPEN_ID auf dem Render-Service aus.
# b) Modus live:   Loggt sich mit dem produktiven Admin-Konto gegen die
#                  Live-API ein und prueft die Berechtigungs-Kette
#                  (login -> account.me -> admin-geschuetzter Endpoint).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Was pruefen?"
        type: choice
        options:
          - db
          - live
          - beides
        default: beides

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Abhaengigkeiten installieren
        if: ${{ inputs.mode != 'live' }}
        run: npm ci --include=dev --no-audit --no-fund
      - name: Konten aus produktiver DB listen
        if: ${{ inputs.mode == 'db' || inputs.mode == 'beides' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/diagnose-admin.ts
      - name: Render-ENV ADMIN_EMAIL / OWNER_OPEN_ID auslesen
        if: ${{ inputs.mode == 'db' || inputs.mode == 'beides' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          key = os.environ["RENDER_API_KEY"]
          app_sid = "srv-dahjgllg1s2s73bf9u4g"

          req = urllib.request.Request(
              f"https://api.render.com/v1/services/{app_sid}/env-vars?limit=100",
              headers={"Authorization": "Bearer " + key},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              entries = json.load(response)

          print("--- Render-ENV (Admin-relevant) ---")
          for entry in entries:
              item = entry.get("envVar", entry)
              if item.get("key") in ("ADMIN_EMAIL", "OWNER_OPEN_ID", "OAUTH_SERVER_URL"):
                  value = item.get("value") or "(leer)"
                  print(f"{item.get('key')} = {value}")
          PY
      - name: Live-API Berechtigungs-Kette pruefen (Admin-Login)
        if: ${{ inputs.mode == 'live' || inputs.mode == 'beides' }}
        env:
          LIVE_API_BASE_URL: ${{ secrets.RENDER_PUBLIC_URL || 'https://cybersarah-control-center.onrender.com' }}
          ADMIN_EMAIL: niko.oeben@gmail.com
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/live-check-admin.mjs
