name: Uptime-Waechter

# Sprint 92: Kostenloser Uptime-Monitor als GitHub-Actions-Cron — ersetzt eine
# UptimeRobot-Anmeldung. Prueft alle 30 Minuten die Produktiv-Gesundheit von
# app.cybersarah-ki.com von AUSSEN (GitHub-Runner in Azure, nicht Render-seitig).
# Verhalten:
# - Ausfall (kein HTTP 200 nach 3 Versuchen): legt genau EIN offenes Issue mit
#   Label 'uptime-alert' an (keine Duplikate — Folgefuehler kommentieren das
#   bestehende Issue) und alarmiert optional den Discord-Webhook.
# - Erholung: kommentiert und schliesst das offene Alert-Issue automatisch.
#
# Sprint 96 (Issue #340): Der Ausfall wird klassifiziert (lib/uptime-alert-logic.mjs).
# Eine Anbieter-Suspendierung ("This service has been suspended by its owner")
# ist kein Deploy-Problem und wird als solche benannt, inklusive des einzigen
# wirksamen naechsten Schritts fuer den Eigentuemer. Ein Resume/Deploy kann sie
# nicht beheben — Render lehnt /resume mit HTTP 400 ab.
#
# Kosten: ~1440 Runner-Minuten/Monat, weit unter dem 2000-Minuten-Kontingent
# privater Repos. Ein manuelles Testen ist jederzeit per workflow_dispatch moeglich.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime-waechter
  cancel-in-progress: false

jobs:
  health-check:
    name: Produktiv-Health pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://app.cybersarah-ki.com/api/health
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ALERT_DIR: /tmp/uptime-alert
    steps:
      - uses: actions/checkout@v4

      - name: Health-Check (3 Versuche, 20s Timeout)
        id: health
        run: |
          set +e
          code=000
          latency=0
          for i in 1 2 3; do
            latency=$(curl -s -o /tmp/health-body.json -w "%{http_code} %{time_total}" --max-time 20 "$HEALTH_URL" 2>/dev/null)
            code="${latency%% *}"
            if [ "$code" = "200" ]; then
              echo "Versuch $i: OK (HTTP $code, ${latency#* }s)"
              break
            fi
            echo "Versuch $i: fehlgeschlagen (HTTP $code)"
            [ "$i" != "3" ] && sleep 20
          done
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "latency=${latency#* }" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "code=$code" >> "$GITHUB_OUTPUT"
            echo "--- Antwortkoerper ---"
            head -c 500 /tmp/health-body.json 2>/dev/null || true
          fi

      - name: Ausfall klassifizieren
        id: classify
        if: steps.health.outputs.ok == 'false'
        continue-on-error: true
        run: |
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          HEALTH_STATUS="${{ steps.health.outputs.code }}" \
          HEALTH_BODY_FILE=/tmp/health-body.json \
          HEALTH_URL="$HEALTH_URL" \
          ALERT_TIMESTAMP="$TS" \
          node scripts/uptime-alert-report.mjs --out "$ALERT_DIR" | tee /tmp/classify.txt
          grep -E '^(classification|owner_action_required|transient)=' /tmp/classify.txt >> "$GITHUB_OUTPUT" || true
          echo "--- Issue-Text ---"
          cat "$ALERT_DIR-body.md"

      - name: Alert-Label sicherstellen
        if: always()
        run: |
          gh label create uptime-alert \
            --repo "$REPO" \
            --color d73a4a \
            --description "Automatischer Uptime-Alarm des Produktiv-Health-Checks" \
            2>/dev/null || echo "Label existiert bereits."

      - name: Bei Ausfall Issue pflegen und Discord alarmieren
        if: steps.health.outputs.ok == 'false'
        run: |
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          if [ ! -s "$ALERT_DIR-body.md" ]; then
            # Fallback, falls die Klassifikation nicht lief: generischer Text.
            printf 'Der automatische Uptime-Waechter hat **%s** als nicht erreichbar erkannt (HTTP-Status: `%s`, %s).\n\nManuelle Pruefung: Render-Dashboard, `render-diagnose.yml`-Workflow und die Health-URL im Browser.\n' \
              "$HEALTH_URL" "${{ steps.health.outputs.code }}" "$TS" > "$ALERT_DIR-body.md"
            printf '⚠️ Immer noch nicht erreichbar (HTTP `%s`, %s).\n' "${{ steps.health.outputs.code }}" "$TS" > "$ALERT_DIR-comment.md"
            printf '🚨 **CyberSarah Produktiv-Ausfall**: app.cybersarah-ki.com nicht erreichbar (HTTP %s) — %s. Details im GitHub-Issue.\n' "${{ steps.health.outputs.code }}" "$TS" > "$ALERT_DIR-discord.txt"
          fi

          OPEN=$(gh issue list --repo "$REPO" --label uptime-alert --state open --json number --jq '.[0].number')
          if [ -z "$OPEN" ]; then
            gh issue create \
              --repo "$REPO" \
              --title "$(cat "$ALERT_DIR-title.txt" 2>/dev/null || echo '🚨 Produktiv-Ausfall: app.cybersarah-ki.com nicht erreichbar')" \
              --label uptime-alert \
              --body-file "$ALERT_DIR-body.md"
            echo "Neues Alert-Issue angelegt."
          else
            gh issue comment "$OPEN" --repo "$REPO" --body-file "$ALERT_DIR-comment.md"
            echo "Bestehendes Alert-Issue #$OPEN kommentiert."
          fi

          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            node -e 'const fs=require("fs");const t=fs.readFileSync(process.env.ALERT_DIR+"-discord.txt","utf8").trim();process.stdout.write(JSON.stringify({content:t}))' > /tmp/discord.json
            curl -sf -H "Content-Type: application/json" -d @/tmp/discord.json "$DISCORD_WEBHOOK_URL" \
              || echo "Discord-Webhook fehlgeschlagen — GitHub-Issue ist die verbindliche Alarmierung."
          fi

      - name: Bei Erholung Issue schliessen
        if: steps.health.outputs.ok == 'true'
        run: |
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          OPEN=$(gh issue list --repo "$REPO" --label uptime-alert --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "$REPO" --body "✅ Produktiv-Health wieder grün (HTTP 200, ${{ steps.health.outputs.latency }}s, ${TS}). Alert wird geschlossen."
            gh issue close "$OPEN" --repo "$REPO"
            echo "Alert-Issue #$OPEN geschlossen."
          else
            echo "Alles grün, kein offener Alert (HTTP 200, ${{ steps.health.outputs.latency }}s)."
          fi
