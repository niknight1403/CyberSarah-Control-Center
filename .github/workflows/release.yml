name: CyberSarah Control Center Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_status:
        description: "Release-Status"
        required: false
        default: "started"
        type: choice
        options: [started, passed, failed, cancelled]

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write release status to summary
        env:
          RELEASE_STATUS: ${{ github.event_name == 'push' && 'passed' || github.event_name == 'release' && 'passed' || inputs.release_status }}
        run: |
          {
            echo "## CyberSarah Control Center Release"
            echo ""
            echo "- Status: **${RELEASE_STATUS}**"
            echo "- Version: \`${{ github.ref_name }}\`"
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
