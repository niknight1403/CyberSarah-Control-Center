name: DB-Ops Konto-Passwort

# Setzt den scrypt-Passwort-Hash eines bestehenden Kontos (user-set-password).
# Es wird NIE ein Klartext-Passwort uebergeben, nur ein lokal vorberechneter
# Hash im Server-Format scrypt$<salt>$<derived>. DATABASE_URL kommt aus den
# verschluesselten Repo-Secrets und erscheint nie im Log.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "E-Mail des Kontos"
        required: true
      hash:
        description: "scrypt-Hash (scrypt$salt$derived) — niemals Klartext"
        required: true

permissions:
  contents: read

jobs:
  user-set-password:
    name: "Passwort-Hash setzen"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Passwort-Hash setzen
        working-directory: scripts/db-ops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OP: user-set-password
          EMAIL: ${{ github.event.inputs.email }}
          HASH: ${{ github.event.inputs.hash }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install pg --no-audit --no-fund >/dev/null 2>&1
          node user-set-password.mjs
