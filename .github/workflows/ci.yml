name: CyberSarah Control Center CI

on:
  push:
    branches: [main, next-development]
  pull_request:
    branches: [main, next-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Workspace-Service-Abhaengigkeiten installieren
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: workspace-service

      - name: TypeScript validation
        run: npm run check

      - name: Workspace-Service Startup-Check
        run: |
          cd workspace-service
          PORT=29787 WORKSPACES_DIR=/proc/cybersarah-unwritable NODE_ENV=production node src/index.js > /tmp/ws-smoke.log 2>&1 &
          WS_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:29787/api/v1/health > /dev/null 2>&1; then
              echo "Workspace-Service Health-Check OK (Fallback-Workspaces)"; kill $WS_PID; exit 0
            fi
            sleep 1
          done
          kill $WS_PID 2>/dev/null || true
          echo "Workspace-Service wurde nicht healthy. Log:"; cat /tmp/ws-smoke.log; exit 1

      - name: Deterministic test suite
        run: npm test

      - name: Workspace service syntax validation
        run: node --check workspace-service/src/index.js

      - name: Workspace service build
        run: npm run build

      - name: Write release handoff artifact
        if: always()
        env:
          CI_STATUS: ${{ job.status == 'success' && 'passed' || 'failed' }}
        run: node scripts/write-release-handoff.mjs

      - name: Upload release handoff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybersarah-release-handoff-${{ github.run_id }}
          path: release-handoff.json
          if-no-files-found: warn

      - name: Audit CI result
        if: always()
        env:
          AUDIT_ACTION: ci
          AUDIT_STATUS: ${{ job.status == 'success' && 'passed' || 'failed' }}
          AUDIT_MESSAGE: ${{ job.status == 'success' && 'CI, TypeScript, Tests und Workspace-Service-Build erfolgreich.' || 'Mindestens eine CI-Prüfung ist fehlgeschlagen.' }}
          EXTERNAL_ACTION_AUDIT_URL: ${{ secrets.EXTERNAL_ACTION_AUDIT_URL }}
          AUDIT_AUTH_TOKEN: ${{ secrets.SERVICE_ACCESS_TOKEN }}
        run: node scripts/ci-audit.mjs
