name: CyberSarah Control Center CI

on:
  push:
    branches: [main, next-development]
  pull_request:
    branches: [main, next-development]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (striktes Lockfile)
        if: github.actor != 'dependabot[bot]'
        run: npm ci

      # Dependabot generiert Lockfiles mit seiner eigenen npm-Version; deren
      # Ideal-Baum-Rekonstruktion kann vom Runner-npm abweichen (z. B. yaml-
      # Nesting) und npm ci blockieren. npm install versoehnt den Baum und
      # prueft weiterhin dieselbe Test- und Build-Akzeptanz. Siehe Sprint 93.
      - name: Install dependencies (Dependabot, Lockfile-Rekonziliation)
        if: github.actor == 'dependabot[bot]'
        run: npm install --no-audit --no-fund

      - name: Workspace-Service-Abhaengigkeiten installieren
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: workspace-service

      - name: TypeScript validation
        run: npm run check

      - name: Workspace-Service Startup-Check (Diagnose, nicht blockierend)
        continue-on-error: true
        run: |
          cd workspace-service
          echo "--- A: plain node"; timeout 8 node -e "console.log('node ok')"; echo "A exit=$?"
          echo "--- B: deps import"; timeout 20 node -e "await import('cors'); await import('express'); await import('http-proxy'); await import('zod'); console.log('imports ok')"; echo "B exit=$?"
          echo "--- C: fallback-dir"; timeout 8 node -e "const fsSync=require('node:fs'); try { fsSync.mkdirSync('/proc/cybersarah-unwritable',{recursive:true}); console.log('primary created?!'); } catch (e) { console.log('primary failed (expected):', e.code); } fsSync.mkdirSync(process.cwd()+'/workspaces',{recursive:true}); console.log('fallback ok')"; echo "C exit=$?"
          echo "--- D: full service (20s, Output direkt im Log)"
          ( PORT=29787 WORKSPACES_DIR=/proc/cybersarah-unwritable NODE_ENV=production timeout 20 node src/index.js; echo "D exit=$?" ) &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:29787/api/v1/health > /dev/null 2>&1; then
              echo "Health-Check OK (Fallback-Workspaces)"; pkill -f "node src/index.js" 2>/dev/null; exit 0
            fi
            sleep 1
          done
          echo "Service nicht healthy nach 20s — Deploy laeuft weiter, Render-Health-Check ist der verbindliche Gate."; pkill -f "node src/index.js" 2>/dev/null; exit 0

      - name: Deterministic test suite mit Coverage
        run: npm run test:coverage

      - name: Coverage-Bericht als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cybersarah-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn

      - name: Coverage-Kommentar im Pull Request (Sprint 92)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/coverage-pr-comment.mjs
      - name: Coverage zu Codecov hochladen (optional, ohne Token uebersprungen)
        if: always()
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "CODECOV_TOKEN nicht gesetzt — Coverage liegt als Artifact bereit. Konto: https://about.codecov.io (fuer private Repos bis 5 Nutzer kostenlos)."
            exit 0
          fi
          curl -sf https://uploader.codecov.io/latest/linux/codecov-linux -o codecov || { echo "Codecov-Uploader nicht erreichbar"; exit 0; }
          chmod +x codecov
          ./codecov -t "$CODECOV_TOKEN" -f coverage/lcov.info -Z || echo "Codecov-Upload fehlgeschlagen — CI bleibt gruen."

      - name: Workspace service syntax validation
        run: node --check workspace-service/src/index.js

      - name: Workspace service build
        run: npm run build

      - name: Write release handoff artifact
        if: always()
        env:
          CI_STATUS: ${{ job.status == 'success' && 'passed' || 'failed' }}
          RELEASE_APP_NAME: CyberSarah Control Center
          RELEASE_ANDROID_PACKAGE: com.app.customaistudiomobile
        run: npx tsx scripts/write-release-handoff.ts

      - name: Upload release handoff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cybersarah-release-handoff-${{ github.run_id }}
          path: release-handoff.json
          if-no-files-found: warn

      - name: Audit CI result
        if: always()
        env:
          AUDIT_ACTION: ci
          AUDIT_STATUS: ${{ job.status == 'success' && 'passed' || 'failed' }}
          AUDIT_MESSAGE: ${{ job.status == 'success' && 'CI, TypeScript, Tests und Workspace-Service-Build erfolgreich.' || 'Mindestens eine CI-Prüfung ist fehlgeschlagen.' }}
          EXTERNAL_ACTION_AUDIT_URL: ${{ secrets.EXTERNAL_ACTION_AUDIT_URL }}
          AUDIT_AUTH_TOKEN: ${{ secrets.SERVICE_ACCESS_TOKEN }}
        run: node scripts/ci-audit.mjs
