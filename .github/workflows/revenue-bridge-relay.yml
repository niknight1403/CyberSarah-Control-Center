name: Revenue-Bridge Relay (Hetzner socat)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST2 || secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER2 || secrets.PRODUCTION_SSH_USER }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY2 || secrets.PRODUCTION_SSH_KEY }}
    steps:
      - name: socat-Forwarder auf Produktion einrichten
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          SSH="ssh -i ~/.ssh/relay_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 $SSH_USER@$SSH_HOST"
          $SSH "sudo bash -s" <<'EOS'
          set -euo pipefail
          echo "== socat vorhanden? =="
          command -v socat || { apt-get update -qq >/dev/null; apt-get install -y -qq socat >/dev/null; }
          command -v socat
          echo "== systemd Unit anlegen =="
          cat > /etc/systemd/system/revenue-bridge-relay.service <<UNIT
          [Unit]
          Description=Revenue-Bridge Relay 18742 -> 127.0.0.1:18741 (nur VM 92.5.177.159)
          After=network-online.target
          [Service]
          ExecStart=/usr/bin/socat TCP-LISTEN:18742,bind=0.0.0.0,fork,reuseaddr,range=92.5.177.159/32 TCP:127.0.0.1:18741
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now revenue-bridge-relay.service
          sleep 2
          systemctl is-active revenue-bridge-relay.service
          echo "== Port pruefen =="
          ss -tlnp | grep 18742 || echo FEHLER-18742
          echo "== Eigener Port horcht lokal weiter? =="
          ss -tlnp | grep 18741 || echo FEHLER-18741
          EOS
          echo "== Von aussen (Runner) muss 18742 blockiert sein =="
          (curl -s -m 8 -o /dev/null -w "Runner-zugriff HTTP=%{http_code}\n" http://"$SSH_HOST":18742/ || echo "Runner korrekt abgewiesen") | head -1
