name: Render Diagnose

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service-Name (leer = alle)"
        required: false
        default: ""

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render-Services und Deploy-Historie abfragen (Render-API)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ inputs.service }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          key = os.environ["RENDER_API_KEY"]
          wanted = os.environ.get("SERVICE", "").strip()

          def api(path):
              req = urllib.request.Request(
                  "https://api.render.com/v1" + path,
                  headers={"Authorization": "Bearer " + key},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          services = api("/services?limit=20")
          print("--- Services ---")
          targets = []
          for entry in services:
              service = entry.get("service", entry)
              print(f"{service.get('name')} | {service.get('id')} | {service.get('type')} | suspended={service.get('suspended')}")
              if not wanted or service.get("name") == wanted:
                  targets.append((service.get("name"), service.get("id")))

          print()
          print("--- Deploy-Historie (neueste zuerst) ---")
          for name, sid in targets:
              print(f"== {name} ({sid}) ==")
              for entry in api(f"/services/{sid}/deploys?limit=8"):
                  deploy = entry.get("deploy", entry)
                  commit = deploy.get("commit")
                  cid = commit.get("id", "?")[:7] if isinstance(commit, dict) else str(commit)
                  print(f"  {deploy.get('id')} | {deploy.get('status')} | commit={cid} | erstellt={deploy.get('createdAt')} | beendet={deploy.get('finishedAt')}")
          print()
          print("--- App-Service: WORKSPACE_SERVICE_URL (Diagnose) ---")
          app_sid = "srv-dahjgllg1s2s73bf9u4g"
          for ev in api(f"/services/{app_sid}/env-vars?limit=100"):
              item = ev.get("envVar", ev)
              if item.get("key") == "WORKSPACE_SERVICE_URL":
                  print("WORKSPACE_SERVICE_URL =", item.get("value"))
          PY

      - name: Render-Logs + healthCheckPath des App-Services (Render-API)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          key = os.environ["RENDER_API_KEY"]

          def api(path):
              req = urllib.request.Request(
                  "https://api.render.com/v1" + path,
                  headers={"Authorization": "Bearer " + key},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          app_sid = "srv-dahjgllg1s2s73bf9u4g"

          print("--- Service-Details (healthCheckPath etc.) ---")
          try:
              svc = api(f"/services/{app_sid}")
              if isinstance(svc, dict) and "service" in svc:
                  svc = svc["service"]
              print(json.dumps({k: svc.get(k) for k in ("name", "healthCheckPath", "autoDeploy", "suspend", "runtime", "dockerfilePath", "dockerContext", "buildFilter", "repo")}, indent=1))
          except Exception as e:
              print("Service-Details-Fehler:", e)

          print()
          print("--- Logs des App-Services (Zeitfenster des fehlgeschlagenen Deploys) ---")
          import urllib.error, datetime as dt
          start = "2026-09-16T06:41:00Z"
          end = "2026-09-16T06:47:00Z"
          attempts = [
              f"/logs?limit=100&service={app_sid}&startTime={urllib.parse.quote(start)}&endTime={urllib.parse.quote(end)}",
              f"/logs?limit=100&startTime={urllib.parse.quote(start)}&endTime={urllib.parse.quote(end)}",
              f"/logs?limit=100&service={app_sid}",
          ]
          logs = None
          owner_id = None
          try:
              for entry in api("/services?limit=20"):
                  svc_o = entry.get("service", entry)
                  if svc_o.get("id") == app_sid:
                      owner_id = svc_o.get("ownerId")
          except Exception as e:
              print("ownerId-Lookup-Fehler:", e)
          print("ownerId:", owner_id)
          attempts2 = [
              f"/logs?limit=100&ownerId={owner_id}&serviceId={app_sid}&startTime={urllib.parse.quote(start)}&endTime={urllib.parse.quote(end)}",
              f"/logs?limit=100&ownerId={owner_id}&serviceId={app_sid}",
              f"/logs?limit=100&ownerId={owner_id}&resourceId={app_sid}",
              f"/logs?limit=100&ownerId={owner_id}&service={app_sid}",
              f"/logs?limit=100&ownerId={owner_id}",
          ]
          for path in attempts2:
              try:
                  logs = api(path)
                  print("OK mit:", path[:90])
                  break
              except urllib.error.HTTPError as e:
                  print("Versuch fehlgeschlagen:", path[:90], "->", e.code, e.read()[:200])
          if logs:
              for entry in logs:
                  line = entry.get("logs", entry)
                  print(line.get("timestamp", ""), "|", line.get("level", "?"), "|", str(line.get("message", ""))[:400])
          PY
