name: OpenHands-Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "OpenHands-Operation"
        required: true
        type: choice
        options:
          - oracle-test
          - disk-clean
          - install
          - compose-up
          - model-pull
          - status
          - verify
          - add-ssh-key
          - deep-analyze
          - disk-detail
          - integrate-free-llm
          - verify-free-llm
          - agent-smoke
        default: install

concurrency:
  group: openhands-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    name: "OpenHands: ${{ github.event.inputs.operation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH-Zugang einrichten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY2 || secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H 167.233.196.20 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Operation ausfuehren
        env:
          OP: ${{ github.event.inputs.operation }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.AI_HUGGINGFACE_API_KEY }}
          SSH_CMD: "ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=accept-new root@167.233.196.20"
        run: |
          echo "OP: $OP"
          case "$OP" in
            oracle-test)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            disk-clean)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            install)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            compose-up)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            model-pull)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            status)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            add-ssh-key)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            verify)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            deep-analyze)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            disk-detail)
              $SSH_CMD 'echo "" | base64 -d | node -'
              ;;
            integrate-free-llm)
              # Free-LLM-Integration: Keys aus Secrets -> VPS .env, Router + Compose ausrollen
              cat > /tmp/remote-integrate.sh <<'REMOTE_EOF'
              set -euo pipefail
              ENV=/opt/openhands/.env
              mkdir -p /opt/openhands/workspace /root/.openhands-state
              cp "$ENV" "$ENV.bak-integrate" 2>/dev/null || true

              set_key() {
                local k="$1" v="$2"
                if grep -q "^$k=" "$ENV" 2>/dev/null; then
                  sed -i "s|^$k=.*|$k=$v|" "$ENV"
                else
                  echo "$k=$v" >> "$ENV"
                fi
              }
              set_key GROQ_API_KEY "$GROQ_API_KEY"
              set_key GEMINI_API_KEY "$GEMINI_API_KEY"
              set_key OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
              set_key HUGGINGFACE_API_KEY "$HUGGINGFACE_API_KEY"

              if grep -q '^ORACLE_OLLAMA_TOKEN_ALT=' "$ENV" 2>/dev/null; then
                TOK=$(grep '^ORACLE_OLLAMA_TOKEN_ALT=' "$ENV" | cut -d= -f2-)
                set_key REMOTE_OLLAMA_TOKEN "$TOK"
              fi
              grep -q '^REMOTE_OLLAMA_URL=' "$ENV" || echo 'REMOTE_OLLAMA_URL=https://ollama.cybersarah-ki.com' >> "$ENV"
              grep -q '^OLLAMA_FALLBACK_MODEL=' "$ENV" || echo 'OLLAMA_FALLBACK_MODEL=qwen2.5-coder:7b' >> "$ENV"
              grep -q '^HF_LLM_MODEL=' "$ENV" || echo 'HF_LLM_MODEL=meta-llama/Llama-3.1-8B-Instruct' >> "$ENV"
              grep -q '^LOCAL_WORKSPACE_PATH=' "$ENV" || echo 'LOCAL_WORKSPACE_PATH=/opt/openhands/workspace' >> "$ENV"
              grep -q '^OPENHANDS_STATE_DIR=' "$ENV" || echo 'OPENHANDS_STATE_DIR=/root/.openhands-state' >> "$ENV"
              grep -q '^OPENHANDS_PORT=' "$ENV" || echo 'OPENHANDS_PORT=3001' >> "$ENV"
              chmod 600 "$ENV"

              echo '' | base64 -d > /opt/openhands/docker-compose.yml
              echo '' | base64 -d > /opt/openhands/free-llm-router.sh
              chmod +x /opt/openhands/free-llm-router.sh

              cat > /etc/cron.d/openhands-free-llm <<'CRON'
              */30 * * * * root /opt/openhands/free-llm-router.sh >> /var/log/openhands-router.log 2>&1
              CRON
              chmod 644 /etc/cron.d/openhands-free-llm

              /opt/openhands/free-llm-router.sh || true
              sleep 6

              echo "== Container =="
              docker ps --filter name=openhands-autonomous-app --format '{{.Names}}: {{.Status}}'
              curl -s -o /dev/null -w "== UI: HTTP %{http_code} ==\n" --max-time 10 http://localhost:3001
              echo "== Aktive Route =="
              grep '^ACTIVE_LLM_' "$ENV" | sed 's|API_KEY=.*|API_KEY=***gesetzt***|'
              echo "== Routen-Status =="
              cat /opt/openhands/free-llm-status.json
              REMOTE_EOF
              {
                printf 'GROQ_API_KEY=%q\n' "${GROQ_API_KEY:-}"
                printf 'GEMINI_API_KEY=%q\n' "${GEMINI_API_KEY:-}"
                printf 'OPENROUTER_API_KEY=%q\n' "${OPENROUTER_API_KEY:-}"
                printf 'HUGGINGFACE_API_KEY=%q\n' "${HUGGINGFACE_API_KEY:-}"
                cat /tmp/remote-integrate.sh
              } | $SSH_CMD 'bash -s'
              ;;
            verify-free-llm)
              $SSH_CMD 'set -e; echo "== Routen-Livecheck =="; /opt/openhands/free-llm-router.sh check || true; echo; echo "== Container =="; docker ps --filter name=openhands-autonomous-app --format "{{.Names}}: {{.Status}}"; curl -s -o /dev/null -w "== UI: HTTP %{http_code} ==\n" --max-time 10 http://localhost:3001; echo "== Aktive Route =="; grep "^ACTIVE_LLM_" /opt/openhands/.env | sed "s|API_KEY=.*|API_KEY=***gesetzt***|"; echo "== Cron =="; cat /etc/cron.d/openhands-free-llm'
              ;;
            agent-smoke)
              $SSH_CMD 'set -uo pipefail; BASE=http://localhost:3001; echo "== Modell-Optionen (Auszug) =="; curl -s --max-time 10 "$BASE/api/options/models" | head -c 400; echo; echo "== Konversation starten =="; CONV=$(curl -s --max-time 20 -X POST "$BASE/api/conversations" -H "Content-Type: application/json" -d "{\"initial_user_msg\":\"Erstelle im Workspace die Datei build-test.txt mit dem Inhalt FREE-LLM-BUILD-TEST-OK und antworte kurz mit DONE.\"}"); echo "$CONV" | head -c 400; echo; CID=$(echo "$CONV" | python3 -c "import json,sys; print(json.load(sys.stdin).get(\"conversation_id\",\"\",))" 2>/dev/null || true); if [ -z "$CID" ]; then echo "FEHLER: Keine conversation_id"; exit 1; fi; echo "== Warte auf Agenten (bis 200s) =="; for i in $(seq 1 40); do sleep 5; ST=$(curl -s --max-time 10 "$BASE/api/conversations/$CID" | python3 -c "import json,sys; print(json.load(sys.stdin).get(\"status\",\"?\"))" 2>/dev/null || echo "?"); echo "Status: $ST"; case "$ST" in *paused*|*finished*|*stopped*|*error*) break;; esac; done; echo "== Ergebnis-Datei =="; if cat /opt/openhands/workspace/build-test.txt 2>/dev/null; then echo " == SMOKE-TEST: BESTANDEN =="; else echo "Datei noch nicht vorhanden (Status: $ST)"; fi'
              ;;
            *)
              echo "Unbekannte Operation: $OP" >&2
              exit 1
              ;;
          esac
