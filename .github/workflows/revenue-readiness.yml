name: Revenue-OS Readiness (GitHub Secrets)

on:
  workflow_dispatch:
  push:
    branches: [main, integration/revenue-os-live-data]
    paths:
      - 'server/revenue-command-*'
      - 'modules/revenue-os/artifacts/api-server/src/app.ts'
      - 'scripts/revenue-readiness.mjs'
      - '.github/workflows/revenue-readiness.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Open temporary SSH tunnel to local Revenue Postgres
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST2 || secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER2 || secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY2 || secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/revenue_tunnel_key
          chmod 600 ~/.ssh/revenue_tunnel_key
          ssh -fN -i ~/.ssh/revenue_tunnel_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -o ConnectTimeout=12 -L 15432:127.0.0.1:5432 "$SSH_USER@$SSH_HOST"
          ssh -fN -i ~/.ssh/revenue_tunnel_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -o ConnectTimeout=12 -L 18741:127.0.0.1:18741 "$SSH_USER@$SSH_HOST"
      - name: Read-only DB schema and Stripe connectivity
        env:
          REVENUE_OS_DB_TUNNEL_PORT: 15432
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVENUE_OS_DATABASE_URL: ${{ secrets.REVENUE_OS_DATABASE_URL }}
          REVENUE_OS_API_BASE_URL: ${{ secrets.REVENUE_OS_API_BASE_URL }}
          REVENUE_OS_API_KEY: ${{ secrets.REVENUE_OS_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/revenue-readiness.mjs
