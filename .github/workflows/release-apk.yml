name: CyberSarah Control Center Android Release

on:
  workflow_dispatch:
    inputs:
      artifact_type:
        description: "Android-Artefakt"
        required: true
        default: aab
        type: choice
        options:
          - aab
          - apk
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit_author: ${{ steps.commit-meta.outputs.author }}
      commit_sha: ${{ steps.commit-meta.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Capture commit metadata
        id: commit-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          author="$(git log -1 --format='%an <%ae>')"
          {
            echo "author<<EOF"
            echo "$author"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm check

      - name: Test suite with JUnit report
        run: pnpm test -- --reporter=verbose --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybersarah-test-reports-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and deep Android validation
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_type: ${{ steps.artifact.outputs.type }}
      artifact_name: ${{ steps.artifact.outputs.name }}
      artifact_path: ${{ steps.artifact.outputs.path }}
      artifact_size: ${{ steps.validate.outputs.artifact_size }}
      artifact_sha256: ${{ steps.validate.outputs.artifact_sha256 }}
      package_name: ${{ steps.validate.outputs.package_name }}
      version_code: ${{ steps.validate.outputs.version_code }}
      version_name: ${{ steps.validate.outputs.version_name }}
      commit_sha: ${{ needs.quality.outputs.commit_sha }}
      commit_author: ${{ needs.quality.outputs.commit_author }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve Android artifact
        id: artifact
        shell: bash
        env:
          REQUESTED_TYPE: ${{ inputs.artifact_type || vars.ANDROID_ARTIFACT_TYPE || 'aab' }}
          CONFIGURED_AAB_PATH: ${{ vars.AAB_PATH }}
          CONFIGURED_APK_PATH: ${{ vars.APK_PATH }}
        run: |
          set -euo pipefail
          artifact_type="${REQUESTED_TYPE,,}"
          case "$artifact_type" in
            aab)
              artifact_path="${CONFIGURED_AAB_PATH:-dist/CyberSarah-Control-Center-1.0.1.aab}"
              ;;
            apk)
              artifact_path="${CONFIGURED_APK_PATH:-dist/CyberSarah-Control-Center-1.0.1.apk}"
              ;;
            *)
              echo "Unbekannter Artefakttyp: $artifact_type"
              exit 1
              ;;
          esac
          test -f "$artifact_path" || {
            echo "Android-Artefakt nicht gefunden: $artifact_path"
            echo "Der Managed-Publish-Build muss die Datei vor diesem Workflow-Schritt bereitstellen."
            exit 1
          }
          echo "type=$artifact_type" >> "$GITHUB_OUTPUT"
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$artifact_path")" >> "$GITHUB_OUTPUT"

      - name: Validate Android artifact
        id: validate
        shell: bash
        env:
          ARTIFACT_TYPE: ${{ steps.artifact.outputs.type }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
          EXPECTED_PACKAGE: ${{ vars.ANDROID_PACKAGE_NAME }}
          EXPECTED_VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE }}
          CONFIGURED_VERSION_NAME: ${{ vars.ANDROID_VERSION_NAME }}
        run: |
          set -euo pipefail
          test -s "$ARTIFACT_PATH"
          unzip -t "$ARTIFACT_PATH" >/dev/null

          artifact_sha256="$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')"
          artifact_size_bytes="$(stat -c '%s' "$ARTIFACT_PATH")"
          artifact_size="$(awk -v bytes="$artifact_size_bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')"
          echo "Artefakt: $ARTIFACT_TYPE, Größe: $artifact_size, SHA-256: $artifact_sha256"

          actual_package=""
          actual_version_code=""
          actual_version_name=""

          if [[ "$ARTIFACT_TYPE" == "apk" ]]; then
            test -n "$EXPECTED_PACKAGE" || { echo "ANDROID_PACKAGE_NAME ist nicht gesetzt."; exit 1; }
            aapt2_bin="$(command -v aapt2 || true)"
            if [[ -z "$aapt2_bin" && -n "${ANDROID_HOME:-}" ]]; then
              aapt2_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
            fi
            test -n "$aapt2_bin" || { echo "aapt2 wurde auf dem Runner nicht gefunden."; exit 1; }
            badging_file="${RUNNER_TEMP}/apk-badging.txt"
            "$aapt2_bin" dump badging "$ARTIFACT_PATH" > "$badging_file"
            package_line="$(grep -m1 '^package:' "$badging_file" || true)"
            actual_package="$(sed -n "s/.*name='\\([^']*\\)' .*/\\1/p" <<< "$package_line")"
            actual_version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
            actual_version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
            [[ "$actual_package" == "$EXPECTED_PACKAGE" ]] || { echo "Package Name stimmt nicht: erwartet '$EXPECTED_PACKAGE', gefunden '$actual_package'."; exit 1; }
            if [[ -n "$EXPECTED_VERSION_CODE" ]]; then
              [[ "$actual_version_code" == "$EXPECTED_VERSION_CODE" ]] || { echo "Version Code stimmt nicht: erwartet '$EXPECTED_VERSION_CODE', gefunden '$actual_version_code'."; exit 1; }
            fi
          else
            # AAB ist ein ZIP-Container. Diese Strukturprüfung blockiert
            # beschädigte oder offensichtlich falsche Archive vor dem Upload.
            unzip -l "$ARTIFACT_PATH" | grep -F 'base/manifest/AndroidManifest.xml' >/dev/null || {
              echo "AAB enthält keine base/manifest/AndroidManifest.xml."
              exit 1
            }
            unzip -l "$ARTIFACT_PATH" | grep -F 'BundleConfig.pb' >/dev/null || {
              echo "AAB enthält keine BundleConfig.pb."
              exit 1
            }
            echo "AAB-Strukturprüfung erfolgreich; Package/Version werden zusätzlich von Google Play beim Bundle-Upload geprüft."
          fi

          echo "artifact_size=$artifact_size" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "package_name=$actual_package" >> "$GITHUB_OUTPUT"
          echo "version_code=$actual_version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$actual_version_name" >> "$GITHUB_OUTPUT"

      - name: Upload validated Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybersarah-android-${{ steps.artifact.outputs.type }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Protected Google Play upload
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-internal
    permissions:
      contents: read
      id-token: write
    outputs:
      upload_target: ${{ steps.play-upload.outputs.upload_target }}
      upload_version_code: ${{ steps.play-upload.outputs.version_code }}
      tester_url: ${{ steps.play-upload.outputs.tester_url }}

    steps:
      - name: Download validated Android artifact
        uses: actions/download-artifact@v4
        with:
          name: cybersarah-android-${{ needs.build.outputs.artifact_type }}
          path: dist

      - name: Authenticate with Google Cloud via OIDC
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_PUBLISHER_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload APK to Internal App Sharing or AAB to Internal Track
        id: play-upload
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name || vars.ANDROID_PACKAGE_NAME }}
          VERSION_CODE_EXPECTED: ${{ needs.build.outputs.version_code }}
          ARTIFACT_TYPE: ${{ needs.build.outputs.artifact_type }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          AAB_PATH: dist/${{ needs.build.outputs.artifact_name }}
          APK_PATH: dist/${{ needs.build.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_TOKEN"
          test -s "$AAB_PATH"
          api_base="https://androidpublisher.googleapis.com"

          if [[ "$ARTIFACT_TYPE" == "apk" ]]; then
            response_file="${RUNNER_TEMP}/internal-app-sharing-response.json"
            http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H 'Content-Type: application/vnd.android.package-archive' \
              --data-binary "@${APK_PATH}" \
              "${api_base}/upload/androidpublisher/v3/applications/internalappsharing/${PACKAGE_NAME}/artifacts/apk")"
            if [[ "$http_code" != 2* ]]; then
              echo "APK-Upload zu Internal App Sharing fehlgeschlagen (HTTP ${http_code})."
              exit 1
            fi
            tester_url="$(jq -r '.downloadUrl // .download_url // empty' "$response_file")"
            echo "upload_target=internal-app-sharing" >> "$GITHUB_OUTPUT"
            echo "version_code=${VERSION_CODE_EXPECTED:-unknown}" >> "$GITHUB_OUTPUT"
            [[ -z "$tester_url" ]] || echo "tester_url=$tester_url" >> "$GITHUB_OUTPUT"
            echo "APK erfolgreich zu Internal App Sharing hochgeladen."
          else
            edit_file="${RUNNER_TEMP}/edit.json"
            bundle_file="${RUNNER_TEMP}/bundle.json"
            track_file="${RUNNER_TEMP}/track.json"

            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d '{}' \
              "${api_base}/androidpublisher/v3/applications/${PACKAGE_NAME}/edits" > "$edit_file"
            edit_id="$(jq -r '.id // empty' "$edit_file")"
            test -n "$edit_id" || { echo "Google Play hat keine Edit-ID zurückgegeben."; exit 1; }

            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@${AAB_PATH}" \
              "${api_base}/upload/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${edit_id}/bundles" > "$bundle_file"
            version_code="$(jq -r '.versionCode // empty' "$bundle_file")"
            test -n "$version_code" || { echo "Google Play hat keinen Versioncode zurückgegeben."; exit 1; }

            version_name="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              version_name="${{ vars.ANDROID_VERSION_NAME }}"
            fi
            test -n "$version_name" || { echo "ANDROID_VERSION_NAME ist für workflow_dispatch erforderlich."; exit 1; }
            jq -n \
              --arg version_code "$version_code" \
              --arg version_name "$version_name" \
              '{releases:[{name:$version_name,versionCodes:[$version_code],status:"completed",releaseNotes:[{language:"de-DE",text:("Interner Test von CyberSarah Control Center " + $version_name + ".")}]}]}' > "$track_file"

            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary "@${track_file}" \
              "${api_base}/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${edit_id}/tracks/internal" >/dev/null

            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "${api_base}/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${edit_id}:commit" >/dev/null

            echo "upload_target=internal-track" >> "$GITHUB_OUTPUT"
            echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
            echo "AAB erfolgreich in den Google-Play-Internal-Track veröffentlicht."
          fi

  notify:
    name: Smart status and Slack notification
    needs: [quality, build, upload]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Determine final status
        id: status
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_RESULT" == "cancelled" || "$BUILD_RESULT" == "cancelled" || "$UPLOAD_RESULT" == "cancelled" ]]; then
            status="CANCELLED"
          elif [[ "$QUALITY_RESULT" == "failure" || "$BUILD_RESULT" == "failure" || "$UPLOAD_RESULT" == "failure" ]]; then
            status="FAILED"
          elif [[ "$QUALITY_RESULT" == "success" && "$BUILD_RESULT" == "success" && "$UPLOAD_RESULT" == "success" ]]; then
            status="SUCCESS"
          else
            status="FAILED"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Send Slack release notification
        if: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL != '' }}
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          STATUS: ${{ steps.status.outputs.status }}
          COMMIT_AUTHOR: ${{ needs.quality.outputs.commit_author || github.actor }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
          ARTIFACT_TYPE: ${{ needs.build.outputs.artifact_type || 'nicht verfügbar' }}
          ARTIFACT_SIZE: ${{ needs.build.outputs.artifact_size || 'nicht verfügbar' }}
          ARTIFACT_SHA256: ${{ needs.build.outputs.artifact_sha256 || 'nicht verfügbar' }}
          UPLOAD_TARGET: ${{ needs.upload.outputs.upload_target || 'nicht verfügbar' }}
          UPLOAD_VERSION_CODE: ${{ needs.upload.outputs.upload_version_code || 'nicht verfügbar' }}
          TESTER_URL: ${{ needs.upload.outputs.tester_url || '' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$STATUS" in
            SUCCESS) color="#2eb67d"; summary="Android-Artefakt validiert und erfolgreich veröffentlicht." ;;
            CANCELLED) color="#ecb22e"; summary="Release-Workflow wurde manuell abgebrochen." ;;
            *) color="#e01e5a"; summary="Quality Gate, Artefaktprüfung oder Google-Play-Upload ist fehlgeschlagen." ;;
          esac

          tester_text="nicht verfügbar"
          if [[ -n "$TESTER_URL" ]]; then
            tester_text="<${TESTER_URL}|Internal App Sharing öffnen>"
          fi

          payload="$(jq -n \
            --arg title "CyberSarah Control Center · ${STATUS}" \
            --arg color "$color" \
            --arg summary "$summary" \
            --arg author "$COMMIT_AUTHOR" \
            --arg sha "${COMMIT_SHA:0:12}" \
            --arg ref "$REF_NAME" \
            --arg event "$EVENT_NAME" \
            --arg quality "$QUALITY_RESULT" \
            --arg build "$BUILD_RESULT" \
            --arg upload "$UPLOAD_RESULT" \
            --arg type "$ARTIFACT_TYPE" \
            --arg size "$ARTIFACT_SIZE" \
            --arg hash "${ARTIFACT_SHA256:0:16}…" \
            --arg target "$UPLOAD_TARGET" \
            --arg version "$UPLOAD_VERSION_CODE" \
            --arg tester "$tester_text" \
            --arg run "$RUN_URL" \
            '{attachments:[{color:$color,blocks:[
              {type:"header",text:{type:"plain_text",text:$title}},
              {type:"section",text:{type:"mrkdwn",text:$summary}},
              {type:"section",fields:[
                {type:"mrkdwn",text:("*Commit-Autor:*\\n" + $author)},
                {type:"mrkdwn",text:("*Commit:*\\n`" + $sha + "`")},
                {type:"mrkdwn",text:("*Tag/Branch:*\\n`" + $ref + "`")},
                {type:"mrkdwn",text:("*Event:*\\n" + $event)},
                {type:"mrkdwn",text:("*Quality:*\\n" + $quality)},
                {type:"mrkdwn",text:("*Build:*\\n" + $build)},
                {type:"mrkdwn",text:("*Upload:*\\n" + $upload)},
                {type:"mrkdwn",text:("*Artefakt:*\\n" + $type)},
                {type:"mrkdwn",text:("*Größe:*\\n" + $size)},
                {type:"mrkdwn",text:("*SHA-256:*\\n`" + $hash + "`")},
                {type:"mrkdwn",text:("*Versioncode:*\\n" + $version)}
              ]},
              {type:"section",text:{type:"mrkdwn",text:("*Tester-Link:*\\n" + $tester)}},
              {type:"actions",elements:[{type:"button",text:{type:"plain_text",text:"GitHub Actions öffnen"},url:$run}]}
            ]}]}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

      - name: Write release summary
        if: always()
        env:
          STATUS: ${{ steps.status.outputs.status }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
        run: |
          {
            echo "## CyberSarah Control Center – Android Release"
            echo ""
            echo "| Job | Status |"
            echo "|---|---|"
            echo "| Quality | ${QUALITY_RESULT} |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| Upload | ${UPLOAD_RESULT} |"
            echo "| Final | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
