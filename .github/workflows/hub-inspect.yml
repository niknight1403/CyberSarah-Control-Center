name: Hub-Inspect

# Rein lesender Statusabruf am Live-Hub (Agentforge2 auf der Oracle-VM).
# Der SSH-Weg dorthin ist nicht verfügbar (ORACLE_SSH_KEY fehlt), die Hub-API
# aber schon: Login mit VF_HUB_EMAIL/VF_HUB_PASSWORD aus den Repo-Secrets.
# Es wird ausschließlich gelesen (GET), nichts gestartet oder geändert.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "villas | projects | both | villa-detail"
        default: "both"
      villa_id:
        description: "Villa-ID (Pflicht bei villa-detail, sonst Filter)"
        default: ""
      base_url:
        description: "Hub-Basis-URL (leer = oeffentliche Domain)"
        default: ""

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hub lesen
        env:
          # HUB_URL im Repo zeigt auf die interne Oracle-Adresse (:12000) und ist
          # von GitHub-Runnern nicht erreichbar. Standard ist deshalb die
          # oeffentliche Domain; HUB_URL wird nur genutzt, wenn sie https ist.
          HUB_URL: ${{ inputs.base_url || secrets.HUB_URL }}
          HUB_EMAIL: ${{ secrets.VF_HUB_EMAIL }}
          HUB_PASSWORD: ${{ secrets.VF_HUB_PASSWORD }}
          MODE: ${{ inputs.mode || 'both' }}
          VILLA_ID: ${{ inputs.villa_id }}
        run: |
          node - <<'JS'
          const PUBLIC_HUB = 'https://hub.cybersarah-ki.com';
          const configured = (process.env.HUB_URL || '').trim();
          const base = (configured.startsWith('https://') ? configured : PUBLIC_HUB).replace(/\/+$/, '');
          console.log(`Hub: ${base}${configured && configured !== base ? ' (HUB_URL ignoriert: keine https-Adresse)' : ''}`);
          const email = process.env.HUB_EMAIL;
          const password = process.env.HUB_PASSWORD;
          const mode = process.env.MODE || 'both';
          const onlyVilla = process.env.VILLA_ID;

          if (!email || !password) {
            console.error('FEHLER: VF_HUB_EMAIL/VF_HUB_PASSWORD fehlen in den Repo-Secrets.');
            process.exit(1);
          }

          // Der Hub gibt beim Login ein Token zurueck und erwartet es als
          // Authorization: Bearer ... (Cookie-Sessions gibt es hier nicht).
          let token = '';
          async function call(path, init = {}) {
            const res = await fetch(base + path, {
              ...init,
              headers: {
                'Content-Type': 'application/json',
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
                ...(init.headers || {}),
              },
            });
            const text = await res.text();
            let body = null;
            try { body = JSON.parse(text); } catch { body = text.slice(0, 300); }
            return { status: res.status, body };
          }

          const login = await call('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email, password }),
          });
          if (login.status !== 200 || !login.body?.token) {
            console.error(`FEHLER: Login am Hub abgelehnt (HTTP ${login.status}).`);
            process.exit(1);
          }
          token = String(login.body.token);
          console.log(`Login ok (HTTP ${login.status}), Rolle ${login.body?.user?.role ?? '?'}.`);

          if (mode === 'villas' || mode === 'both') {
            const villas = await call('/api/villas');
            if (villas.status !== 200) {
              console.error(`FEHLER: /api/villas -> HTTP ${villas.status}`);
            } else {
              const rows = Array.isArray(villas.body) ? villas.body : [];
              const filtered = onlyVilla ? rows.filter((v) => String(v.id) === String(onlyVilla)) : rows;
              console.log(`\n== Villen (${filtered.length} von ${rows.length}) ==`);
              for (const v of filtered) {
                const pct = v.tasks_total ? Math.round((100 * v.tasks_done) / v.tasks_total) : 0;
                console.log(
                  `#${v.id} ${v.name} | ${v.status} | Aufgaben ${v.tasks_done}/${v.tasks_total} (${pct} %)` +
                  ` | offen ${v.openCount ?? '?'} | fehlgeschlagen ${v.tasks_failed ?? 0}` +
                  ` | aktiv ${v.executing ? 'ja' : 'nein'}${v.queued ? ', Warteschlange' : ''}` +
                  `${v.retry ? ' | retry: ' + JSON.stringify(v.retry).slice(0, 160) : ''}`,
                );
              }
            }
          }

          if (mode === 'villa-detail') {
            if (!onlyVilla) {
              console.error('FEHLER: villa-detail braucht villa_id.');
              process.exit(1);
            }
            // Offene und fehlgeschlagene Aufgaben einer Villa, inklusive
            // Gate-Grund im result-Feld. Rein lesend.
            for (const status of ['RUNNING', 'READY', 'PENDING', 'REVIEW', 'FAILED', 'BLOCKED']) {
              const res = await call(`/api/villas/${onlyVilla}/tasks?status=${status}&limit=50`);
              if (res.status !== 200) {
                console.error(`FEHLER: Aufgaben (${status}) -> HTTP ${res.status}`);
                continue;
              }
              const rows = Array.isArray(res.body) ? res.body : [];
              if (!rows.length) continue;
              console.log(`\n== ${status} (${rows.length}) ==`);
              for (const t of rows) {
                const detail = String(t.result || t.error || '').replace(/\s+/g, ' ').slice(0, 220);
                console.log(`#${t.id} [P${t.priority ?? '?'}] ${t.title}`);
                if (detail) console.log(`   ${detail}`);
              }
            }
          }

          if (mode === 'projects' || mode === 'both') {
            const projects = await call('/api/deep/projects');
            if (projects.status !== 200) {
              console.error(`FEHLER: /api/deep/projects -> HTTP ${projects.status}`);
            } else {
              const rows = Array.isArray(projects.body) ? projects.body : (projects.body.projects || []);
              console.log(`\n== Projekte (${rows.length}) ==`);
              for (const p of rows) {
                const bits = [`#${p.id}`, p.name || p.title || '(ohne Namen)', p.status || '', p.stage || ''];
                if (p.tasks_total !== undefined) bits.push(`Aufgaben ${p.tasks_done ?? '?'}/${p.tasks_total}`);
                console.log(bits.filter(Boolean).join(' | '));
              }
            }
          }
          JS
