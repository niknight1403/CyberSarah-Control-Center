name: Secret hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan tracked source for exposed credentials
        shell: bash
        run: |
          set -euo pipefail
          # High-confidence credential formats only; never print matched values.
          patterns='(sk-or-v1-[A-Za-z0-9-]{30,}|sk-ant-[A-Za-z0-9_-]{30,}|gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
          if git grep -I -n -E "$patterns" -- . ':!**/docs/**' ':!**/*lock*' ':!**/tests/**' ':!**/*test*' ':!**/*spec*'; then
            echo "::error::Potential hard-coded credential found. The matching value is intentionally not printed."
            exit 1
          fi
          echo "Secret hygiene scan passed; no high-confidence credential patterns found in tracked source."
