name: Free Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-android-debug-apk.yml'
  pull_request:
    paths:
      - '.github/workflows/free-android-debug-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Build installable unsigned-release-independent debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Seed CSS interop cache
        run: |
          mkdir -p node_modules/react-native-css-interop/.cache
          touch node_modules/react-native-css-interop/.cache/web.css
      - name: Export app for Android wrapper
        env:
          EXPO_USE_METRO_WORKSPACE_ROOT: '1'
          EXPO_PUBLIC_API_BASE_URL: https://app.cybersarah-ki.com
          EXPO_PUBLIC_APP_VARIANT: development
        run: npx expo export -p web --output-dir web-dist
      - name: Verify exported app
        run: |
          node scripts/inject-startup-shell.mjs web-dist
          node scripts/web-export-smoke.mjs web-dist
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Validate APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberSarah-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
