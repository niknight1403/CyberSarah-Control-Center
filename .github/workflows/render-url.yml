name: Render Echte URL

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  url:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: URL + Domains + DNS
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          api() { curl -s -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" "https://api.render.com/v1/$1"; }
          echo "== serviceDetails.url + renderSubdomainPolicy =="
          api "services/srv-dahjgllg1s2s73bf9u4g" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          sd = d.get('serviceDetails', {})
          print('url:', sd.get('url'))
          print('renderSubdomainPolicy:', json.dumps(sd.get('renderSubdomainPolicy')))
          print('sshAddress:', sd.get('sshAddress'))
          print('autoDeploy:', d.get('autoDeploy'), d.get('autoDeployTrigger'))
          "
          echo "== Domains (roh) =="
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/srv-dahjgllg1s2s73bf9u4g/domains" | head -c 2000; echo
          echo "== DNS A/AAAA =="
          for H in cybersarah-ki.com www.cybersarah-ki.com hub.cybersarah-ki.com app.cybersarah-ki.com; do
            A=$(dig +short A "$H" | tr '\n' ' ')
            AAAA=$(dig +short AAAA "$H" | tr '\n' ' ')
            echo "$H | A: $A| AAAA: $AAAA"
          done
          echo "== Health-Check auf Deploy-Status =="
          curl -s --max-time 90 "https://app.cybersarah-ki.com/api/ready" | head -c 300; echo
