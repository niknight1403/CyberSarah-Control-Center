name: revenue-autopilot

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: revenue-autopilot
  cancel-in-progress: false

jobs:
  run:
    name: Revenue-Autopilot-Lauf
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revenue-Autopilot sicher aufrufen
        env:
          BASE_URL: ${{ secrets.RENDER_PUBLIC_URL }}
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::Revenue-Autopilot nicht konfiguriert (RENDER_PUBLIC_URL/METRICS_TOKEN fehlen)."
            exit 1
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::RENDER_PUBLIC_URL muss eine HTTPS-Adresse sein."; exit 1 ;;
          esac
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          http_code="$(curl --silent --show-error --fail-with-body --retry 2 --retry-delay 2 \
            --max-time 120 --connect-timeout 15 \
            --output "$body_file" --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $TOKEN" \
            "${BASE_URL%/}/api/cron/revenue-autopilot")" || {
              echo "::error::Revenue-Autopilot-Anfrage fehlgeschlagen (HTTP/Netzwerk)."
              exit 1
            }
          if [ "$http_code" != "200" ]; then
            echo "::error::Revenue-Autopilot antwortete mit HTTP $http_code."
            exit 1
          fi
          if ! jq -e '.ok == true' "$body_file" >/dev/null 2>&1; then
            echo "::error::Revenue-Autopilot meldete keinen bestätigten Erfolg."
            exit 1
          fi
          echo "Revenue-Autopilot-Lauf erfolgreich bestätigt."
