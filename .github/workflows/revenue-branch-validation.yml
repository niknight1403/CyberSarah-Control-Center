name: Revenue Branch Validation
on:
  push:
    branches:
      - feat/revenue-sprints-10-20261101
    paths:
      - 'server/revenue-*.ts'
      - 'tests/revenue-*.test.ts'
      - '.github/workflows/revenue-branch-validation.yml'
      - 'scripts/vercel-ignore-build.sh'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revenue-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify types
        run: npm run check
      - name: Targeted revenue regression tests
        run: npx vitest run tests/revenue-connectors.test.ts tests/revenue-meter-ledger.test.ts tests/revenue-sprint-primitives.test.ts tests/revenue-integrations-api.test.ts
      - name: Verify Vercel quota gate is production-safe
        shell: bash
        run: |
          set -euo pipefail
          VERCEL_ENV=preview bash scripts/vercel-ignore-build.sh
          VERCEL_ENV=development bash scripts/vercel-ignore-build.sh
          set +e
          env -u VERCEL_ENV bash scripts/vercel-ignore-build.sh
          unset_result=$?
          VERCEL_ENV=unrecognized bash scripts/vercel-ignore-build.sh
          unknown_result=$?
          set -e
          if [ "$unset_result" -ne 1 ] || [ "$unknown_result" -ne 1 ]; then
            echo "Unknown/unset Vercel environment must never suppress production builds."
            exit 1
          fi
          set +e
          VERCEL_ENV=production bash scripts/vercel-ignore-build.sh
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo "Production must not be skipped by Vercel ignored build step."
            exit 1
          fi
          echo "Vercel gate accepts production deployment."
