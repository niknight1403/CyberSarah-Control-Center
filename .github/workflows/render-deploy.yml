name: Render Deploy

# Bootstrap und Updates des CyberSarah Control Center auf Render
# (Koyeb-Ersatz, 100 % kostenfrei: Render Free + Neon Free).
# Alle Werte kommen aus GitHub Actions Secrets — das Deployment ist
# damit vollstaendig automatisiert, keine manuelle ENV-Nacharbeit.
# Ausloesen: GitHub UI → Actions → "Render Deploy" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Was soll deployt werden?'
        type: choice
        options:
          - app
          - workspace
          - domain
        default: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci --include=dev

      - name: Workspace-Service-Abhaengigkeiten installieren
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: workspace-service

      - name: Workspace-Service Startup-Check (Diagnose, nicht blockierend)
        continue-on-error: true
        run: |
          cd workspace-service
          echo "--- A: plain node"; timeout 8 node -e "console.log('node ok')"; echo "A exit=$?"
          echo "--- B: deps import"; timeout 20 node -e "await import('cors'); await import('express'); await import('http-proxy'); await import('zod'); console.log('imports ok')"; echo "B exit=$?"
          echo "--- C: fallback-dir"; timeout 8 node -e "const fsSync=require('node:fs'); try { fsSync.mkdirSync('/proc/cybersarah-unwritable',{recursive:true}); console.log('primary created?!'); } catch (e) { console.log('primary failed (expected):', e.code); } fsSync.mkdirSync(process.cwd()+'/workspaces',{recursive:true}); console.log('fallback ok')"; echo "C exit=$?"
          echo "--- D: full service (20s, Output direkt im Log)"
          ( PORT=29787 WORKSPACES_DIR=/proc/cybersarah-unwritable NODE_ENV=production timeout 20 node src/index.js; echo "D exit=$?" ) &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:29787/api/v1/health > /dev/null 2>&1; then
              echo "Health-Check OK (Fallback-Workspaces)"; pkill -f "node src/index.js" 2>/dev/null; exit 0
            fi
            sleep 1
          done
          echo "Service nicht healthy nach 20s — Deploy laeuft weiter, Render-Health-Check ist der verbindliche Gate."; pkill -f "node src/index.js" 2>/dev/null; exit 0

      - name: TypeCheck und Tests
        run: |
          npm run check
          npm test

      - name: Auf Render deployen (App, Migrationen + Health-Check)
        if: inputs.target == 'app'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Sprint 85: Gemini-Key fuer On-Server-Fallback (Forge > Gemini > OpenAI)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Sprint 108 (Zero-Cost-Router): Kostenlose Provider — fehlende
          # Secrets bleiben leer, der Router ignoriert inaktive Provider.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL }}
          OWNER_OPEN_ID: ${{ secrets.OWNER_OPEN_ID }}
          # ADMIN_EMAIL wird an Render synchronisiert (buildServiceEnv) —
          # macht die Admin-Rolle unabhaengig vom Code-Default.
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          WORKSPACE_SERVICE_URL: ${{ secrets.WORKSPACE_SERVICE_URL }}
          # Fallback: gleiches Token wie der Workspace-Service selbst (SERVICE_ACCESS_TOKEN)
          WORKSPACE_SERVICE_TOKEN: ${{ secrets.WORKSPACE_SERVICE_TOKEN || secrets.SERVICE_ACCESS_TOKEN }}
          RENDER_PUBLIC_URL: ${{ secrets.RENDER_PUBLIC_URL }}
          # Sprint 367: Publishing-Tokens (optional — leere Secrets bleiben
          # leer, die Modus-Aufloesung ignoriert inaktive Plattformen).
          X_PUBLISH_TOKEN: ${{ secrets.X_PUBLISH_TOKEN }}
          LINKEDIN_PUBLISH_TOKEN: ${{ secrets.LINKEDIN_PUBLISH_TOKEN }}
          LINKEDIN_PUBLISH_USER_URN: ${{ secrets.LINKEDIN_PUBLISH_USER_URN }}
          THREADS_PUBLISH_TOKEN: ${{ secrets.THREADS_PUBLISH_TOKEN }}
          THREADS_PUBLISH_USER_ID: ${{ secrets.THREADS_PUBLISH_USER_ID }}
          INSTAGRAM_PUBLISH_TOKEN: ${{ secrets.INSTAGRAM_PUBLISH_TOKEN }}
          INSTAGRAM_PUBLISH_USER_ID: ${{ secrets.INSTAGRAM_PUBLISH_USER_ID }}
          TIKTOK_PUBLISH_TOKEN: ${{ secrets.TIKTOK_PUBLISH_TOKEN }}
          PUBLIC_APP_ORIGIN: ${{ secrets.PUBLIC_APP_ORIGIN }}
          STRIPE_MODE: live
          STRIPE_PRICE_LOOKUP_KEY: cybersarah-monthly
        run: node scripts/render-deploy.mjs --migrate

      - name: Workspace-Service auf Render deployen (Port 8787)
        if: inputs.target == 'workspace'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ACCESS_TOKEN: ${{ secrets.SERVICE_ACCESS_TOKEN }}
          WORKSPACE_ALLOWED_ORIGIN: ${{ secrets.WORKSPACE_ALLOWED_ORIGIN }}
          # Sprint 85: erst auf "true" setzen, wenn die Render-Disk (Mount /data)
          # gebucht ist — siehe docs/SPRINT_85_PERSISTENT_DISK.md.
          WORKSPACE_STORAGE_PERSISTENT: ${{ secrets.WORKSPACE_STORAGE_PERSISTENT || 'false' }}
          # Sprint-85-Follow-up (kostenlose Alternative): Neon-Postgres-Persistenz
          # (Audit-Log + WIP-Backups, Schema workspace_service). Nutzt das
          # bestehende DATABASE_URL-Secret — kein neuer Account, keine Kosten.
          WORKSPACE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Sprint 108 (Zero-Cost-Router): Provider-Keys fuer den Workspace-
          # Service (Custom-AI-Studio) — nur gesetzt, wenn Secrets existieren.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/render-deploy.mjs --workspace

      - name: Custom Domain abschliessen (Phase 5, Sprint 84)
        if: inputs.target == 'domain'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Sprint 85: Gemini-Key fuer On-Server-Fallback (Forge > Gemini > OpenAI)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Sprint 108 (Zero-Cost-Router): Kostenlose Provider — fehlende
          # Secrets bleiben leer, der Router ignoriert inaktive Provider.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL }}
          OWNER_OPEN_ID: ${{ secrets.OWNER_OPEN_ID }}
          # ADMIN_EMAIL wird an Render synchronisiert (buildServiceEnv) —
          # macht die Admin-Rolle unabhaengig vom Code-Default.
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          WORKSPACE_SERVICE_URL: ${{ secrets.WORKSPACE_SERVICE_URL }}
          WORKSPACE_SERVICE_TOKEN: ${{ secrets.WORKSPACE_SERVICE_TOKEN || secrets.SERVICE_ACCESS_TOKEN }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || 'app.cybersarah-ki.com' }}
          CUSTOM_DOMAIN_WAIT_MINUTES: '15'
        run: node scripts/render-deploy.mjs --domain
