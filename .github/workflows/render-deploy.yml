name: Render Deploy

# Bootstrap und Updates des CyberSarah Control Center auf Render
# (Koyeb-Ersatz, 100 % kostenfrei: Render Free + Neon Free).
# Alle Werte kommen aus GitHub Actions Secrets — das Deployment ist
# damit vollstaendig automatisiert, keine manuelle ENV-Nacharbeit.
# Ausloesen: GitHub UI → Actions → "Render Deploy" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Was soll deployt werden?'
        type: choice
        options:
          - app
          - workspace
        default: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci --include=dev

      - name: Workspace-Service-Abhaengigkeiten installieren
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: workspace-service

      - name: Workspace-Service Startup-Check
        run: |
          cd workspace-service
          PORT=29787 WORKSPACES_DIR=/proc/cybersarah-unwritable NODE_ENV=production node src/index.js > /tmp/ws-smoke.log 2>&1 &
          WS_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:29787/api/v1/health > /dev/null 2>&1; then
              echo "Workspace-Service Health-Check OK (Fallback-Workspaces)"; kill $WS_PID; exit 0
            fi
            sleep 1
          done
          kill $WS_PID 2>/dev/null || true
          echo "Workspace-Service wurde nicht healthy. Log:"; cat /tmp/ws-smoke.log; exit 1

      - name: TypeCheck und Tests
        run: |
          npm run check
          npm test

      - name: Auf Render deployen (App, Migrationen + Health-Check)
        if: inputs.target == 'app'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL }}
          OWNER_OPEN_ID: ${{ secrets.OWNER_OPEN_ID }}
          WORKSPACE_SERVICE_URL: ${{ secrets.WORKSPACE_SERVICE_URL }}
          # Fallback: gleiches Token wie der Workspace-Service selbst (SERVICE_ACCESS_TOKEN)
          WORKSPACE_SERVICE_TOKEN: ${{ secrets.WORKSPACE_SERVICE_TOKEN || secrets.SERVICE_ACCESS_TOKEN }}
          STRIPE_MODE: live
          STRIPE_PRICE_LOOKUP_KEY: cybersarah-monthly
        run: node scripts/render-deploy.mjs --migrate

      - name: Workspace-Service auf Render deployen (Port 8787)
        if: inputs.target == 'workspace'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ACCESS_TOKEN: ${{ secrets.SERVICE_ACCESS_TOKEN }}
          WORKSPACE_ALLOWED_ORIGIN: ${{ secrets.WORKSPACE_ALLOWED_ORIGIN }}
        run: node scripts/render-deploy.mjs --workspace
