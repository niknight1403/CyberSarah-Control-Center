name: Content Pipeline Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/draft-engine*.ts"
      - "server/channel-autopilot.ts"
      - "server/publishing-service.ts"
      - "server/image-generation.ts"
      - "server/media-pipeline.ts"
      - "lib/draft-engine-logic.ts"
      - "lib/image-generation-logic.ts"
      - "drizzle/schema.ts"
      - "drizzle/0026_approved_content_pipeline.sql"
      - "tests/content-pipeline*.test.ts"
      - ".github/workflows/content-pipeline-gate.yml"
  push:
    branches: [main]
    paths:
      - "server/draft-engine*.ts"
      - "server/channel-autopilot.ts"
      - "server/publishing-service.ts"
      - "server/image-generation.ts"
      - "server/media-pipeline.ts"
      - "lib/draft-engine-logic.ts"
      - "lib/image-generation-logic.ts"
      - "drizzle/schema.ts"
      - "drizzle/0026_approved_content_pipeline.sql"
      - "tests/content-pipeline*.test.ts"
      - ".github/workflows/content-pipeline-gate.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npx vitest run tests/draft-engine-logic.test.ts tests/image-generation-logic.test.ts tests/media-pipeline-logic.test.ts tests/channel-autopilot-logic.test.ts
      - run: npm run build
