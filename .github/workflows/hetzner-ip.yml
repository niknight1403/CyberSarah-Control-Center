name: Hetzner-IP erfassen
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST2 || secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER2 || secrets.PRODUCTION_SSH_USER }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY2 || secrets.PRODUCTION_SSH_KEY }}
      GH_TOKEN: ${{ secrets.CCC_ADMIN_GITHUB_TOKEN }}
    steps:
      - name: Oeffentliche IP des Produktionsservers speichern
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ip_key
          chmod 600 ~/.ssh/ip_key
          IP=$(ssh -i ~/.ssh/ip_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'curl -s --max-time 10 ifconfig.me' | tr -dc "0-9.")
          test -n "$IP" && echo "IP erfasst: $IP"
          gh variable set HETZNER_PUBLIC_IP --body "$IP" --repo "${{ github.repository }}"
          echo "Variable gesetzt."
