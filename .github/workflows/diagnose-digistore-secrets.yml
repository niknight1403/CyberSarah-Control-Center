name: Diagnose Digistore24 Secrets
on:
  push:
    branches: [diag/provider-health-2026-10-28]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Presence only
        env:
          D24_API: ${{ secrets.DIGISTORE24_API_KEY }}
          D24_SECRET: ${{ secrets.DIGISTORE24_IPN_SECRET }}
          D24_PASSPHRASE: ${{ secrets.DIGISTORE24_IPN_PASSPHRASE }}
        run: |
          for pair in "DIGISTORE24_API_KEY:$D24_API" "DIGISTORE24_IPN_SECRET:$D24_SECRET" "DIGISTORE24_IPN_PASSPHRASE:$D24_PASSPHRASE"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -n "$value" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
