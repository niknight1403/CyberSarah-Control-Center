name: Live-Verifikation (App + DB + Login)

# Prueft nach dem VM-DB-Umzug den Livestand: Ready-Status, Admin-Konto in der
# DB und den tRPC-Login-Pfad (bewusst falsches Passwort => strukturierte
# UNAUTHORIZED-Antwort beweist Routing + DB-Lookup + scrypt-Compare).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ready + Admin-Row + Login-Smoke
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "== /api/ready =="
          curl -s --max-time 90 "https://app.cybersarah-ki.com/api/ready" | head -c 300; echo
          echo "== Admin-Zeile in der VM-DB =="
          psql "$DATABASE_URL" -tA -c "SELECT email, role, created_at::date FROM users WHERE lower(email)='niko.oeben@gmail.com';" 2>&1 | head -3
          echo "== Login-Smoke (falsches Passwort erwartet) =="
          CODE=$(curl -s -o /tmp/login.json -w "%{http_code}" --max-time 90 -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"niko.oeben@gmail.com","password":"definitiv-falsches-passwort"}' \
            "https://app.cybersarah-ki.com/api/trpc/account.login")
          echo "HTTP=$CODE"
          head -c 400 /tmp/login.json; echo
          echo "== App-Wurzel (static web) =="
          curl -s -o /dev/null -w "HTTP=%{http_code} type=%{content_type}\n" --max-time 60 "https://app.cybersarah-ki.com/"
