# Sprint 91: Dependabot haelt Abhaengigkeiten und GitHub Actions aktuell.
# Expo-/React-Native-Updates werden bewusst als Pull Requests bereitgestellt
# (Grundentscheidung: Major-Upgrades als eigene Sprints) — kleine Patch- und
# Minor-Updates koennen direkt ueber PRs abgewickelt werden.
version: 2
updates:
  # Haupt-App (package.json im Repo-Wurzel-Ordner)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Eng verwandte Expo-/Metro-Pakete gemeinsam updaten, um Breaking Changes
      # in einem Review behandeln zu koennen.
      expo-and-metro:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "metro"
          - "metro-*"
          - "nativewind"
      react-native:
        patterns:
          - "react-native"
          - "react-native-*"
          - "@react-native-*"
      dev-and-test:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "tsx"
          - "eslint*"
          - "prettier"
    ignore:
      # Expo-SDK-Major-Spruenge bleiben eigene Sprints (siehe NEXT_STEPS.md,
      # Sprint 87). Sprint 110: Muster auf das komplette Expo-/Metro- und
      # React-Native-Umfeld erweitert — ein einzelner SDK-58-Paket-Sprung
      # (z. B. expo-router@58 gegen gepinntes SDK 57) sprengt sonst die
      # Lockfile-Rekonziliation (ERESOLVE) und verbrennt CI-Minuten.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "metro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "metro-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nativewind"
        update-types: ["version-update:semver-major"]
      # Sprint-134-Follow-up (16.09.): Auch RN-MINOR-Sprünge ignorieren —
      # React-Native-Minor-Versionen folgen der Expo-SDK-Linie (SDK 57 =>
      # RN 0.86.x). Dependabot schlug RN 0.87 mit kaputtem Lockfile vor
      # (npm ci: EUSAGE), obwohl SDK 58 noch nicht erschienen ist. RN- und
      # RN-Modul-Sprünge werden im SDK-58-Sprint gemeinsam gehoben.
      # Patch-Updates innerhalb der gepinnten Version bleiben erlaubt.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"

  # Workspace-Service (eigener package-lock)
  - package-ecosystem: "npm"
    directory: "/workspace-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-workspace-service)"

  # GitHub Actions selbst aktuell halten
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci-deps)"
