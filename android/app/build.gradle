apply plugin: 'com.android.application'

android {
    namespace "com.cybersarah.controlcenter"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cybersarah.controlcenter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Sprint 73: Release-Signierung. Keystore liegt NIE im Repo, sondern wird
    // im CI-Runner aus GitHub-Secrets dekodiert (ANDROID_KEYSTORE_PATH etc.).
    // Ohne diese ENV-Variablen (z. B. lokaler Build) bleibt der Release-Typ
    // unsigniert — dann greift der bisherige Owner-Handoff.
    signingConfigs {
        release {
            if (rootProject.hasProperty('cybersarahKeystorePath')) {
                storeFile file(cybersarahKeystorePath)
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Sprint 73 HOTFIX: R8 vorlaeufig deaktiviert. Ursache fuer den
            // weissen Screen bei Erstinstallation der signierten Release-APK:
            // sehr wahrscheinlich eine von R8 wegoptimierte, per Reflexion
            // von Capacitor benoetigte Klasse (kein Cordova-Plugin im Projekt,
            // Kandidat: AndroidX-WebView-Kompat-Klassen). Bisher lief NIE ein
            // R8-minifizierter Build auf einem echten Geraet (nur Debug-APK
            // und AAB, letzteres nie direkt installiert). Nach Bestaetigung,
            // dass die App ohne R8 startet, folgt ein gezielter Re-Enable mit
            // ausfuehrlicheren -keep-Regeln plus Geraetetest vor Rollout.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (rootProject.hasProperty('cybersarahKeystorePath')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Kotlin >= 1.8 hat die jdk7/jdk8-Klassen in kotlin-stdlib integriert;
    // alte 1.6.21-Transitives erzeugen "Duplicate class"-Fehler beim
    // checkDebugDuplicateClasses-Task (Capacitor-v7-Standardfix).
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib 1.8.22 enthaelt die jdk7-Klassen")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib 1.8.22 enthaelt die jdk8-Klassen")
        }
    }
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
