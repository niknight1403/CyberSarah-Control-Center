alloy:
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.central.receiver]
      }

      loki.source.kubernetes_events "events" {
        job_name   = "integrations/kubernetes/eventhandler"
        log_format = "logfmt"
        forward_to = [loki.write.central.receiver]
      }

      loki.write "central" {
        endpoint {
          // Replace with a private, cluster-reachable Loki URL.
          url = "http://LOKI_PRIVATE_ENDPOINT:3100/loki/api/v1/push"
        }
      }
  mounts:
    varlog: true
controller:
  type: daemonset
